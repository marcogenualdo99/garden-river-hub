<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Kitchen Monitor · Garden River</title>
<link rel="apple-touch-icon" href="../logo-hub-app.jpg">
<link rel="icon" type="image/png" href="../logo-hub-app.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cucina">
<meta name="mobile-web-app-capable" content="yes">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, updateDoc, query, where, onSnapshot, enableNetwork, disableNetwork }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAnVI0MTNKZ9rIHpATgKyCp88nq0u0vsY",
    authDomain: "garden-river-conti-febed.firebaseapp.com",
    projectId: "garden-river-conti-febed",
    storageBucket: "garden-river-conti-febed.firebasestorage.app",
    messagingSenderId: "113994721180",
    appId: "1:113994721180:web:c41d309c9270134b640a59"
  };

  const app  = initializeApp(firebaseConfig, "cucina");
  const db   = getFirestore(app);
  const auth = getAuth(app);

  window._fbCucina = { db, collection, doc, updateDoc, query, where, onSnapshot, enableNetwork, disableNetwork };
  window._fbCucinaReady = false;

  function segnalaPronto() {
    if (window._fbCucinaReady) return;
    window._fbCucinaReady = true;
    window.dispatchEvent(new Event('firebase-cucina-ready'));
  }
  onAuthStateChanged(auth, user => { if (user) segnalaPronto(); });
  signInAnonymously(auth).catch(() => segnalaPronto());
  setTimeout(segnalaPronto, 8000);
</script>

<style>
:root {
  --bg:        #0f1117;
  --bg2:       #1a1d27;
  --bg3:       #22263a;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --text:      #f0f0f0;
  --text2:     #8a8fa8;
  --text3:     #555a72;
  --green:     #22c55e;
  --green-bg:  rgba(34,197,94,0.12);
  --green-bd:  rgba(34,197,94,0.25);
  --amber:     #f59e0b;
  --amber-bg:  rgba(245,158,11,0.12);
  --amber-bd:  rgba(245,158,11,0.25);
  --blue:      #60a5fa;
  --blue-bg:   rgba(96,165,250,0.12);
  --blue-bd:   rgba(96,165,250,0.25);
  --red:       #f87171;
  --font: 'Inter', -apple-system, sans-serif;
  --radius: 14px;
  --radius-sm: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
.hidden { display: none !important; }

/* ── LOGIN ──────────────────────────────────────────────────────────── */
#login-screen {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px;
}
#login-screen.hidden { display: none; }
.login-logo { height: 72px; width: auto; border-radius: 16px; margin-bottom: 20px; }
.login-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.login-sub   { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
.login-card  { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 22px 18px; width: 100%; max-width: 320px; }
.login-label { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.login-select { width: 100%; height: 46px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: var(--font); padding: 0 12px; margin-bottom: 12px; outline: none; }
.login-btn { width: 100%; height: 48px; background: var(--green); color: #000; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 800; cursor: pointer; font-family: var(--font); }
.login-btn:active { opacity: .85; }
.login-err { font-size: 12px; color: var(--red); margin-top: 8px; text-align: center; min-height: 18px; }

/* ── HEADER ──────────────────────────────────────────────────────────── */
.top-bar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
.header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; padding: 10px 16px; gap: 12px; }
.header-left  { display: flex; align-items: center; gap: 10px; }
.header-icon  { font-size: 22px; }
.header-title { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.2; }
.header-sub   { font-size: 11px; color: var(--text2); margin-top: 1px; }

/* ── FILTRI ──────────────────────────────────────────────────────────── */
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 30px; padding: 0 14px; border-radius: 30px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.pill.active-pranzo { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
.pill.active-cena   { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber); }
.pill.active-data   { background: var(--bg3); border-color: var(--border2); color: var(--text); }

/* ── MAIN ────────────────────────────────────────────────────────────── */
main { max-width: 900px; margin: 0 auto; padding: 16px 14px 40px; }

/* ── STATS BAR ───────────────────────────────────────────────────────── */
.stats-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.stat-chip { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
.stat-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stat-dot.attesa  { background: var(--text3); }
.stat-dot.uscito  { background: var(--green); }
.stat-num  { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1; }
.stat-lbl  { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ── GRID COMANDE ────────────────────────────────────────────────────── */
.comande-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

/* ── COMANDA CARD ────────────────────────────────────────────────────── */
.comanda-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: opacity .3s, border-color .2s; }
.comanda-card.uscita { opacity: .45; }
.comanda-card.uscita .card-fam { color: var(--text3); }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-fam  { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.3; }
.card-unita { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ── CHECKBOX USCITO ─────────────────────────────────────────────────── */
.check-btn {
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 50%; border: 2px solid var(--border2);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: transparent;
  transition: all .2s; -webkit-tap-highlight-color: transparent;
}
.check-btn:not(.checked):hover { border-color: var(--green); }
.check-btn.checked { background: var(--green); border-color: var(--green); color: #000; }
.check-btn.loading { opacity: .5; pointer-events: none; }

/* ── PIATTI LIST ─────────────────────────────────────────────────────── */
.piatti-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.piatto-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.piatto-nome { font-size: 14px; color: var(--text); font-weight: 500; flex: 1; }
.piatto-qty  { font-size: 13px; font-weight: 800; color: var(--text2); background: var(--bg3); padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
.comanda-card.uscita .piatto-nome { color: var(--text3); text-decoration: line-through; }

/* ── NOTE ────────────────────────────────────────────────────────────── */
.card-note { font-size: 12px; color: var(--amber); background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: 8px; padding: 6px 10px; margin-top: 8px; line-height: 1.4; }

/* ── DIVISORE TIPO ───────────────────────────────────────────────────── */
.section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin: 18px 0 10px; padding: 0 2px; }

/* ── EMPTY STATE ─────────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon  { font-size: 40px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text2); }
.empty-sub   { font-size: 13px; }

/* ── TOAST ───────────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--bg3); color: var(--text); border: 1px solid var(--border2); padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; z-index: 9999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── OROLOGIO ────────────────────────────────────────────────────────── */
.clock { font-size: 12px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <img class="login-logo" src="../logo-hub-app.jpg" alt="Garden River">
  <div class="login-title">Kitchen Monitor</div>
  <div class="login-sub">Accesso riservato allo staff</div>
  <div class="login-card">
    <div class="login-label">Operatore</div>
    <select class="login-select" id="sel-operatore">
      <option value="">Seleziona operatore…</option>
    </select>
    <button class="login-btn" onclick="doLogin()">Accedi</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- HEADER -->
<div class="top-bar hidden" id="app-header">
  <div class="header-inner">
    <div class="header-left">
      <span class="header-icon">👨‍🍳</span>
      <div>
        <div class="header-title">Kitchen Monitor</div>
        <div class="header-sub" id="hdr-sub">—</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
      <div class="pill-group" id="pill-data">
        <button class="pill active-data" id="pill-oggi"   onclick="setData('oggi')">Oggi</button>
        <button class="pill"             id="pill-domani" onclick="setData('domani')">Domani</button>
      </div>
      <div class="pill-group" id="pill-tipo">
        <button class="pill active-pranzo" id="pill-pranzo" onclick="setTipo('pranzo')">Pranzo</button>
        <button class="pill"               id="pill-cena"   onclick="setTipo('cena')">Cena</button>
      </div>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="hidden" id="app-main">
  <div class="stats-bar" id="stats-bar"></div>
  <div id="comande-container"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── STATO ────────────────────────────────────────────────────────────────
let operatori     = [];
let currentOp     = null;
let dataSelezionata = 'oggi';
let tipoSelezionato = 'pranzo';
let ordini        = [];        // snapshot corrente
let unsubscribe   = null;

// ── DATE ─────────────────────────────────────────────────────────────────
function isoDate(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}
const OGGI   = isoDate(0);
const DOMANI = isoDate(1);

function getDataISO() { return dataSelezionata === 'oggi' ? OGGI : DOMANI; }

// ── TIPO AUTO (pranzo prima delle 14, cena dopo) ─────────────────────────
function tipoAuto() {
  return new Date().getHours() < 14 ? 'pranzo' : 'cena';
}

// ── FIREBASE ──────────────────────────────────────────────────────────────
function waitForFirebase() {
  return new Promise(resolve => {
    if (window._fbCucinaReady) return resolve();
    window.addEventListener('firebase-cucina-ready', () => resolve(), { once: true });
  });
}

// ── AVVIO ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  await waitForFirebase();
  tipoSelezionato = tipoAuto();
  aggiornaClockLoop();

  // Controlla sessione hub
  const hubSession = loadHubSession();
  if (hubSession) {
    currentOp = hubSession.nome;
    avviaApp();
  } else {
    await caricaOperatori();
    document.getElementById('login-screen').classList.remove('hidden');
  }
});

// ── SESSIONE HUB ──────────────────────────────────────────────────────────
function loadHubSession() {
  try {
    const raw = sessionStorage.getItem('gr_session');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed?.nome ? parsed : null;
  } catch { return null; }
}

// ── OPERATORI ─────────────────────────────────────────────────────────────
async function caricaOperatori() {
  try {
    const { db, collection, query } = window._fbCucina;
    const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const snap = await getDocs(collection(db, 'operatori'));
    operatori = snap.docs.map(d => ({ nome: d.id, ...d.data() }));
    const sel = document.getElementById('sel-operatore');
    operatori.forEach(op => {
      const opt = document.createElement('option');
      opt.value = op.nome;
      opt.textContent = op.nome;
      sel.appendChild(opt);
    });
  } catch(e) { console.error('Errore caricamento operatori:', e); }
}

function doLogin() {
  const sel = document.getElementById('sel-operatore');
  const nome = sel.value;
  if (!nome) { document.getElementById('login-err').textContent = 'Seleziona un operatore.'; return; }
  currentOp = nome;
  document.getElementById('login-screen').classList.add('hidden');
  avviaApp();
}

// ── APP ───────────────────────────────────────────────────────────────────
function avviaApp() {
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('app-main').classList.remove('hidden');
  aggiornaHeader();
  aggiornaPills();
  avviaListener();
}

function avviaListener() {
  if (unsubscribe) unsubscribe();

  const { db, collection, query, where, onSnapshot } = window._fbCucina;
  const data = getDataISO();

  const q = query(
    collection(db, 'ordini_ristorazione'),
    where('data', '==', data),
    where('tipo', '==', tipoSelezionato)
  );

  unsubscribe = onSnapshot(q, snap => {
    ordini = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    render();
  }, err => console.error('Errore listener:', err));
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  renderStats();
  renderComande();
}

function renderStats() {
  const totali  = ordini.length;
  const usciti  = ordini.filter(o => o.servito).length;
  const attesa  = totali - usciti;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-chip">
      <div><div class="stat-num">${totali}</div><div class="stat-lbl">Comande totali</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-dot attesa"></div>
      <div><div class="stat-num">${attesa}</div><div class="stat-lbl">Da servire</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-dot uscito"></div>
      <div><div class="stat-num">${usciti}</div><div class="stat-lbl">Usciti</div></div>
    </div>
  `;
}

function renderComande() {
  const container = document.getElementById('comande-container');

  if (ordini.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">Nessuna comanda</div>
        <div class="empty-sub">Non ci sono ordini per ${tipoSelezionato} del ${dataSelezionata === 'oggi' ? 'oggi' : 'domani'}.</div>
      </div>`;
    return;
  }

  // Ordina: prima quelli da servire, poi usciti; dentro ogni gruppo per unità
  const daServire = ordini.filter(o => !o.servito).sort((a,b) => (a.unita||'').localeCompare(b.unita||''));
  const usciti    = ordini.filter(o =>  o.servito).sort((a,b) => (a.unita||'').localeCompare(b.unita||''));

  let html = '';

  if (daServire.length > 0) {
    html += `<div class="section-label">Da servire (${daServire.length})</div>`;
    html += `<div class="comande-grid">`;
    daServire.forEach(o => { html += buildCard(o); });
    html += `</div>`;
  }

  if (usciti.length > 0) {
    html += `<div class="section-label">Usciti (${usciti.length})</div>`;
    html += `<div class="comande-grid">`;
    usciti.forEach(o => { html += buildCard(o); });
    html += `</div>`;
  }

  container.innerHTML = html;
}

function buildCard(ordine) {
  const uscita = ordine.servito;
  const piatti = (ordine.piatti || []).filter(p => p.quantita > 0);
  const note   = ordine.note?.trim();

  const piattiHtml = piatti.map(p => `
    <div class="piatto-item">
      <span class="piatto-nome">${esc(p.piatto)}</span>
      <span class="piatto-qty">×${p.quantita}</span>
    </div>
  `).join('');

  const noteHtml = note ? `<div class="card-note">📝 ${esc(note)}</div>` : '';

  return `
    <div class="comanda-card ${uscita ? 'uscita' : ''}" id="card-${ordine._id}">
      <div class="card-head">
        <div>
          <div class="card-fam">${esc(ordine.famiglia_nome || '—')}</div>
          <div class="card-unita">Unità ${esc(ordine.unita || '—')}</div>
        </div>
        <button
          class="check-btn ${uscita ? 'checked' : ''}"
          id="chk-${ordine._id}"
          onclick="toggleServito('${ordine._id}', ${uscita})"
          title="${uscita ? 'Segna come non uscito' : 'Segna come uscito'}"
          aria-label="${uscita ? 'Uscito' : 'Segna uscito'}">
          ✓
        </button>
      </div>
      <div class="piatti-list">${piattiHtml}</div>
      ${noteHtml}
    </div>
  `;
}

// ── TOGGLE SERVITO ────────────────────────────────────────────────────────
async function toggleServito(id, statoAttuale) {
  const btn = document.getElementById(`chk-${id}`);
  if (btn) btn.classList.add('loading');

  try {
    const { db, doc, updateDoc } = window._fbCucina;
    await updateDoc(doc(db, 'ordini_ristorazione', id), { servito: !statoAttuale });
    showToast(statoAttuale ? 'Segnato come da servire' : '✓ Uscito');
  } catch(e) {
    console.error('Errore toggle servito:', e);
    showToast('Errore — riprova');
    if (btn) btn.classList.remove('loading');
  }
}

// ── FILTRI ────────────────────────────────────────────────────────────────
function setData(d) {
  dataSelezionata = d;
  aggiornaHeader();
  aggiornaPills();
  avviaListener();
}

function setTipo(t) {
  tipoSelezionato = t;
  aggiornaHeader();
  aggiornaPills();
  avviaListener();
}

function aggiornaPills() {
  document.getElementById('pill-oggi').className   = 'pill' + (dataSelezionata === 'oggi'   ? ' active-data' : '');
  document.getElementById('pill-domani').className = 'pill' + (dataSelezionata === 'domani' ? ' active-data' : '');
  document.getElementById('pill-pranzo').className = 'pill' + (tipoSelezionato === 'pranzo' ? ' active-pranzo' : '');
  document.getElementById('pill-cena').className   = 'pill' + (tipoSelezionato === 'cena'   ? ' active-cena' : '');
}

function aggiornaHeader() {
  const giornoLabel = dataSelezionata === 'oggi' ? 'Oggi' : 'Domani';
  const tipoLabel   = tipoSelezionato === 'pranzo' ? 'Pranzo' : 'Cena';
  document.getElementById('hdr-sub').textContent = `${giornoLabel} · ${tipoLabel} · ${currentOp || '—'}`;
}

// ── OROLOGIO ──────────────────────────────────────────────────────────────
function aggiornaClockLoop() {
  function tick() {
    const now = new Date();
    const hh  = String(now.getHours()).padStart(2, '0');
    const mm  = String(now.getMinutes()).padStart(2, '0');
    const el  = document.getElementById('clock');
    if (el) el.textContent = `${hh}:${mm}`;
  }
  tick();
  setInterval(tick, 10000);
}

// ── HELPERS ───────────────────────────────────────────────────────────────
window.toggleServito = toggleServito;
window.setData       = setData;
window.setTipo       = setTipo;
window.doLogin       = doLogin;

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
