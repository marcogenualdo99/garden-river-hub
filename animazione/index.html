<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Programma animazione · Garden River</title>
<link rel="icon" type="image/png" href="../logo-hub-app.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  body { background: var(--gray-50); font-family: var(--font); }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 90px; }
  h1 { font-family: 'Dela Gothic One', var(--font); font-size: 24px; color: var(--green-700); margin: 6px 0 4px }
  .sub { font-size: 13px; color: var(--gray-500); line-height: 1.5; margin-bottom: 18px }
  .box { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06) }
  .box h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px }
  .nota { font-size: 12px; color: var(--gray-500); line-height: 1.5; margin-top: 8px }
  .btn { height: 44px; padding: 0 20px; border: none; border-radius: 999px; font-weight: 800; font-size: 14px; font-family: var(--font); cursor: pointer }
  .btn.primary { background: var(--green-700); color: #fff }
  .btn.ghost { background: var(--gray-100); color: var(--gray-700) }
  .btn:disabled { opacity: .5 }
  .field { margin: 12px 0 }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--gray-700); margin-bottom: 5px }
  input, select { font-family: var(--font) }
  .field input { width: 100%; height: 46px; padding: 0 13px; border: 1.5px solid var(--gray-300); border-radius: 12px; font-size: 14.5px; background: #fff }
  .cat-row { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 6px; align-items: center; margin-bottom: 6px }
  .cat-row input[type=text], .vrow input, .vrow select, .cat-row .em { height: 38px; border: 1.5px solid var(--gray-300); border-radius: 10px; padding: 0 8px; font: 600 13.5px var(--font); min-width: 0; width: 100%; background: #fff }
  .cat-row .em { text-align: center; font-size: 18px }
  .cat-row label { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; white-space: nowrap }
  .x { border: none; background: var(--gray-100); border-radius: 10px; width: 34px; height: 34px; font-size: 18px; line-height: 1; cursor: pointer; color: var(--gray-700) }
  .tabs { display: flex; gap: 6px; background: var(--gray-100); border-radius: 14px; padding: 4px; margin-top: 8px }
  .tabs button { flex: 1; height: 40px; border: none; border-radius: 11px; background: transparent; font: 800 14px var(--font); color: var(--gray-500); cursor: pointer }
  .tabs button.on { background: var(--green-700); color: #fff }
  .grp { border: 1.5px solid var(--green-200); border-radius: 14px; padding: 0 10px 6px; margin-bottom: 8px }
  .grp summary { cursor: pointer; font: 800 14px var(--font); color: var(--green-700); padding: 11px 2px; display: flex; align-items: center; gap: 8px }
  .grp summary span { margin-left: auto; background: var(--green-100); border-radius: 999px; padding: 2px 9px; font-size: 12px }
  .day { border: 1.5px solid var(--green-200); border-radius: 16px; padding: 12px; margin-top: 12px }
  .day h4 { font-size: 15px; font-weight: 800; color: var(--green-700); display: flex; align-items: center; gap: 8px }
  .day h4 select { margin-left: auto; height: 32px; font-size: 12px; border: 1.5px solid var(--gray-300); border-radius: 8px; max-width: 130px }
  .fase { margin-top: 10px }
  .fase .t { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 4px }
  .vrow { display: grid; grid-template-columns: 1fr 96px 34px; gap: 6px; margin-bottom: 6px }
  .add { border: 1.5px dashed var(--green-400); background: none; border-radius: 10px; font: 700 12.5px var(--font); color: var(--green-700); height: 34px; padding: 0 12px; cursor: pointer }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid var(--gray-100); z-index: 30 }
  .savebar .btn { width: 100%; height: 50px; max-width: 728px; display: block; margin: 0 auto }
  .msg { text-align: center; padding: 80px 24px; color: var(--gray-700); line-height: 1.6 }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50 }
  .toast.show { opacity: 1 }
</style>
</head>
<body>
<main id="app"><div class="msg">Caricamento…</div></main>
<div class="toast" id="toast"></div>

<script>
const FN_URL = 'https://area-ospite-113994721180.europe-west1.run.app';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const GIORNI = [['sab','Sabato'],['dom','Domenica'],['lun','Lunedì'],['mar','Martedì'],['mer','Mercoledì'],['gio','Giovedì'],['ven','Venerdì']];
const FASCE = [['d','Diurno'],['m','Mini club (4-10 anni)'],['t','Teen club (11-17 anni)'],['s','Serale']];
let D = { catalogo: [], settimane: { 1: {}, 2: {} }, data_inizio: '', luogo_serate: '' };
let sett = 1;
const aperti = new Set();
let sporco = false;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
async function chiama(azione, extra) {
  const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ azione, token: TOKEN, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { const e = new Error(j.errore || 'errore'); e.codice = j.errore; throw e; }
  return j;
}
function scaduto() { $('#app').innerHTML = '<div class="msg"><h1>Link non valido</h1><p>Questo link è scaduto o è stato revocato.<br>Chiedi alla reception di generarne uno nuovo.</p></div>'; }

function prog(g, f) { const w = (D.settimane[sett] = D.settimane[sett] || {}); w[g] = w[g] || {}; return (w[g][f] = w[g][f] || []); }
function mod() { sporco = true; }

function render() {
  const riga = (a, i) => `<div class="cat-row">
    <input class="em" value="${esc(a.emoji)}" maxlength="4" onchange="D.catalogo[${i}].emoji=this.value.trim();mod()">
    <input type="text" value="${esc(a.nome)}" placeholder="Nome attività" onchange="D.catalogo[${i}].nome=this.value.trim();mod();renderProg()">
    <label><input type="checkbox"${a.speciale ? ' checked' : ''} onchange="D.catalogo[${i}].speciale=this.checked;mod()">Speciale</label>
    <button class="x" aria-label="Elimina" onclick="elimina(${i})">×</button></div>`;
  const gruppi = FASCE.map(([f, nome]) => {
    const voci = D.catalogo.map((a, i) => [a, i]).filter(([a]) => a.fascia === f).sort((x, y) => x[0].nome.localeCompare(y[0].nome));
    return `<details class="grp"${aperti.has(f) ? ' open' : ''} ontoggle="this.open?aperti.add('${f}'):aperti.delete('${f}')"><summary>${esc(nome.split(' (')[0])}<span>${voci.length}</span></summary>${voci.map(([a, i]) => riga(a, i)).join('') || '<p class="nota">Nessuna attività.</p>'}<button class="add" onclick="aggiungi('${f}')">+ Aggiungi attività</button></details>`;
  }).join('');
  $('#app').innerHTML = `
    <h1>Programma animazione</h1>
    <p class="sub">Garden River · Modifica attività e programma delle due settimane. Ricordati di premere «Salva» in fondo: le modifiche compaiono subito nell'app degli ospiti.</p>
    <div class="box"><h3>1 · Attività</h3><p class="nota" style="margin:0 0 10px">Tocca una categoria per aprirla. Le attività «speciali» sono le serate da mettere in evidenza.</p>${gruppi}</div>
    <div class="box"><h3>2 · Programma settimanale</h3>
      <div class="field"><label>Data di partenza (il sabato in cui inizia la Settimana 1)</label><input type="date" id="data" value="${esc(D.data_inizio)}" onchange="D.data_inizio=this.value;mod()"></div>
      <div class="tabs"><button id="tab1" onclick="vaiSett(1)">Settimana 1</button><button id="tab2" onclick="vaiSett(2)">Settimana 2</button></div>
      <div class="row-btns"><button class="btn ghost" id="copia" onclick="copiaSett()"></button></div>
      <div id="prog"></div></div>
    <div class="box"><h3>3 · Serate</h3><div class="field"><label>Dove si svolgono le serate</label><input id="luogo" value="${esc(D.luogo_serate)}" placeholder="Teatro" oninput="D.luogo_serate=this.value;mod()"></div></div>
    <div class="savebar"><button class="btn primary" id="salva" onclick="salva()">Salva programma</button></div>`;
  renderProg();
}
function renderProg() {
  [1, 2].forEach(n => $('#tab' + n).classList.toggle('on', n === sett));
  $('#copia').textContent = 'Copia dalla Settimana ' + (sett === 1 ? 2 : 1);
  const opz = (f, sel) => '<option value="">— scegli —</option>' + D.catalogo.filter(a => a.fascia === f && a.nome).map(a =>
    `<option value="${esc(a.id)}"${a.id === sel ? ' selected' : ''}>${esc((a.emoji || '') + ' ' + a.nome)}</option>`).join('');
  $('#prog').innerHTML = GIORNI.map(([g, nome]) => `<div class="day"><h4>${nome}
    <select onchange="copiaGiorno('${g}',this.value);this.value=''"><option value="">Copia da…</option>${GIORNI.filter(x => x[0] !== g).map(x => `<option value="${x[0]}">${x[1]}</option>`).join('')}</select></h4>
    ${FASCE.map(([f, fn]) => `<div class="fase"><div class="t">${fn}</div>
      ${prog(g, f).map((v, i) => `<div class="vrow">
        <select onchange="prog('${g}','${f}')[${i}].a=this.value;mod()">${opz(f, v.a)}</select>
        <input value="${esc(v.ora)}" placeholder="10.00" onchange="prog('${g}','${f}')[${i}].ora=this.value.trim();mod()">
        <button class="x" aria-label="Rimuovi" onclick="prog('${g}','${f}').splice(${i},1);mod();renderProg()">×</button></div>`).join('')}
      <button class="add" onclick="prog('${g}','${f}').push({a:'',ora:''});mod();renderProg()">+ Aggiungi</button></div>`).join('')}</div>`).join('');
}
function vaiSett(n) { sett = n; renderProg(); }
function copiaSett() {
  const da = sett === 1 ? 2 : 1;
  if (!confirm('Sostituire la Settimana ' + sett + ' con una copia della Settimana ' + da + '?')) return;
  D.settimane[sett] = JSON.parse(JSON.stringify(D.settimane[da] || {})); mod(); renderProg();
}
function copiaGiorno(a, da) {
  if (!da) return;
  if (!confirm('Sostituire il programma di questo giorno con quello copiato?')) return;
  D.settimane[sett][a] = JSON.parse(JSON.stringify(D.settimane[sett][da] || {})); mod(); renderProg();
}
function aggiungi(f) { D.catalogo.push({ id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nome: '', emoji: '⭐', fascia: f, speciale: false }); aperti.add(f); mod(); render(); }
function elimina(i) {
  const a = D.catalogo[i];
  if (!confirm(`Eliminare "${a.nome || 'attività'}"? Sparirà anche dal programma.`)) return;
  D.catalogo.splice(i, 1);
  Object.values(D.settimane).forEach(w => Object.values(w).forEach(gg => Object.keys(gg).forEach(f => { gg[f] = gg[f].filter(v => v.a !== a.id); })));
  mod(); render();
}
async function salva() {
  const btn = $('#salva'); btn.disabled = true;
  try {
    const catalogo = D.catalogo.filter(a => a.nome.trim());
    await chiama('anim_ext_salva', { catalogo, settimane: D.settimane, data_inizio: D.data_inizio || '', luogo_serate: (D.luogo_serate || '').trim() });
    sporco = false; toast('Programma salvato');
  } catch (e) {
    if (e.codice === 'link_non_valido') scaduto(); else toast('Errore di salvataggio: riprova');
  }
  btn.disabled = false;
}
window.addEventListener('beforeunload', e => { if (sporco) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  if (!TOKEN) return scaduto();
  try {
    const j = await chiama('anim_ext_carica');
    const s = j.settimane || {};
    D = { catalogo: j.catalogo || [], settimane: { 1: s[1] || s['1'] || {}, 2: s[2] || s['2'] || {} }, data_inizio: j.data_inizio || '', luogo_serate: j.luogo_serate || '' };
    render();
  } catch (e) {
    if (e.codice === 'link_non_valido') scaduto();
    else $('#app').innerHTML = '<div class="msg">Impossibile caricare il programma. Controlla la connessione e riprova.</div>';
  }
})();
</script>
</body>
</html>
