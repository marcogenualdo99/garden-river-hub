}

// Tutte le richieste di questo ospite: prima quelle di oggi, poi le
// precedenti (finche' la pulizia periodica non le elimina). Card
// indipendente dal form, tenuta aggiornata da un polling leggero.
function renderStatoRichieste() {
  const wrap = $('#navetta-stato-richieste');
  if (!wrap) return;
  const lista = CFG.navetta_corse || [];
  if (!lista.length) { wrap.innerHTML = ''; return; }
  const oggi = oggiData();
  const di_oggi = lista.filter(c => c.data === oggi);
  const prec = lista.filter(c => c.data !== oggi);
  wrap.innerHTML =
    (di_oggi.length ? `<div class="lista-titolo">Le tue corse di oggi</div>${di_oggi.map(c => statoCardHtml(c, true)).join('')}` : '') +
    (prec.length ? `<div class="lista-titolo">Corse precedenti</div>${prec.map(c => statoCardHtml(c, false)).join('')}` : '');
  hydrateIcons(wrap);
}

// Persone della prenotazione che non hanno ancora una corsa attiva: un cliente
// puo' avere piu' corse insieme (ad esempio la famiglia che si divide) finche'
// le persone nelle corse attive non superano quelle della prenotazione. Quando
// un ritiro e' completato (o la corsa annullata) quelle persone si liberano.
function personeTotali() { return (CFG.prenotazione && CFG.prenotazione.persone_totali) || 0; }
function personeInCorsa() {
  return (CFG.navetta_corse || []).filter(corsaConta).reduce((t, c) => t + (c.persone || 1), 0);
}
function personeResidue() {
  const tot = personeTotali();
  if (!tot) return (CFG.navetta_corse || []).some(corsaConta) ? 0 : postiPulmino();   // totale ignoto: una corsa alla volta
  return Math.max(0, tot - personeInCorsa());
}
function limitePersone() { return Math.min(postiPulmino(), personeResidue()); }
function aggiornaLimitePersone() {
  const lim = limitePersone();
  document.querySelectorAll('#num-grid .num-btn').forEach(el => { el.style.display = +el.dataset.n <= lim ? '' : 'none'; });
  if (personeScelte && personeScelte > lim) {
    personeScelte = null; orarioScelto = null;
    document.querySelectorAll('#num-grid .num-btn.selected, #navetta-form-card .slot-btn.selected').forEach(el => el.classList.remove('selected'));
    $('#orari-box').style.display = 'none'; $('#passo-orario').style.display = 'none';
    aggiornaGriglieSlot(); aggiornaBottone();
  }
  const g = $('#persone-guida');
  if (g) g.textContent = personeTotali() && personeInCorsa()
    ? `Restano ${personeResidue()} ${personeResidue() === 1 ? 'persona' : 'persone'} della tua prenotazione senza corsa. Tocca quante tornano con questa navetta.`
    : `Tocca il numero di persone che tornano con la navetta (compreso te). Il pulmino ha ${postiPulmino()} posti.`;
}
let _formNascosto = false;
function aggiornaFormNavetta() {
  const form = $('#navetta-form-card');
  if (!form) return;
  const blocco = $('#navetta-blocco'), conf = $('#navetta-conferma-card');
  if (personeResidue() <= 0) {
    _formNascosto = true;
    form.style.display = 'none';
    blocco.style.display = conf.style.display === 'block' ? 'none' : 'block';
    const t = personeTotali();
    blocco.querySelector('p').textContent = t
      ? `Tutte le ${t} persone della tua prenotazione hanno già una corsa. Quando un ritiro sarà completato, o se annulli una corsa, potrai prenotare di nuovo.`
      : 'Puoi avere una sola prenotazione per volta. Quando il ritiro sarà completato potrai prenotarne un\'altra.';
  } else if (_formNascosto) {
    _formNascosto = false;
    renderNavetta();                          // ricomincia da capo
  } else {
    aggiornaLimitePersone();
  }
}

// Annullamento da parte dell'ospite (stesso preavviso del cambio orario).
let _annullaId = null;
function chiediAnnulla(id) { _annullaId = id; if (id) { _editId = null; _editOrario = null; } renderStatoRichieste(); }
async function annullaCorsa(id) {
  const btn = $('#annulla-conf'), err = $('#annulla-err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Annullo…';
  try {
    const d = await chiama({ azione: 'navetta_annulla', id });
    if (d.ok) { _annullaId = null; await aggiornaStato(true); return; }
    err.textContent = d.errore === 'troppo_tardi' ? `Non si può più annullare: mancano meno di ${preavvisoModifica()} minuti alla corsa. Chiama la reception.`
      : d.errore === 'corsa_non_modificabile' ? 'Questa corsa è già stata chiusa.'
      : 'Annullamento non riuscito. Riprova.';
  } catch (e) {
    err.textContent = 'Connessione assente. Controlla la rete e riprova.';
  }
  err.style.display = 'block';
  btn.disabled = false; btn.textContent = 'Sì, annulla';
}

function apriCambioOrario(id) { _editId = id; _editOrario = null; renderStatoRichieste(); }
function chiudiCambioOrario() { _editId = null; _editOrario = null; renderStatoRichieste(); }
function scegliOrarioNuovo(ora) {
  _editOrario = ora;
  document.querySelectorAll('#edit-slots .slot-btn').forEach(el => el.classList.toggle('selected', el.dataset.ora === ora));
  $('#edit-conf').disabled = false;
}
async function confermaCambioOrario() {
  if (!_editId || !_editOrario) return;
  const btn = $('#edit-conf'), err = $('#edit-err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Salvataggio…';
  try {
    const d = await chiama({ azione: 'navetta_modifica_orario', id: _editId, orario: _editOrario });
    if (d.ok) { _editId = null; _editOrario = null; await aggiornaStato(true); return; }
    if (['orario_occupato', 'corsa_duplicata', 'autista_occupato', 'posti_insufficienti'].includes(d.errore)) aggiornaStato(false);
    err.textContent = d.errore === 'troppo_tardi' ? `Non si può più cambiare: mancano meno di ${preavvisoModifica()} minuti alla corsa.`
      : d.errore === 'orario_occupato' ? 'Questo orario è appena stato prenotato da un altro ospite. Scegline un altro.'
      : d.errore === 'autista_occupato' || d.errore === 'posti_insufficienti' ? 'Su quell\'orario non c\'è posto per tutto il gruppo. Scegli un altro orario.'
      : d.errore === 'corsa_duplicata' ? 'Hai già una richiesta a quell\'orario.'
      : d.errore === 'orario_non_valido' ? 'Scegli un orario tra quelli disponibili.'
      : d.errore === 'corsa_non_modificabile' ? 'Questa corsa non si può più modificare.'
      : 'Modifica non riuscita. Riprova.';
  } catch (e) {
    err.textContent = 'Connessione assente. Controlla la rete e riprova.';
  }
  err.style.display = 'block';
  btn.disabled = false; btn.textContent = 'Conferma';
}

// Aggiornamento stato richieste: ogni 8s, e subito quando la pagina torna
// visibile / a fuoco / online (i browser mobili fermano i timer in background).
let _pollTimer = null, _inVolo = false;
async function aggiornaStato(forza) {
  if (_inVolo || !CFG) return;
  _inVolo = true;
  try {
    const d = await chiama({ azione: 'navetta_stato' });
    if (!d.ok) return;
    if (d.oggi) CFG.oggi = d.oggi;            // cambio giorno anche a pagina rimasta aperta
    verificaFase();
    const corse = d.navetta_corse || (d.navetta_oggi || []).map(c => ({ data: oggiData(), ...c }));
    const occupati = d.orari_occupati || CFG.orari_occupati || [];
    const postiOcc = d.posti_occupati || CFG.posti_occupati || {};
    const firma = JSON.stringify([corse, occupati, postiOcc, corse.some(scaduta)]);
    if (forza || firma !== _ultimoStato) {
      _ultimoStato = firma;
      CFG.navetta_corse = corse; CFG.orari_occupati = occupati; CFG.posti_occupati = postiOcc; if (d.oggi) CFG.oggi = d.oggi;
      aggiornaGriglieSlot();                  // gli orari presi da altri ospiti si spengono subito
      if (_editId && !forza) return;          // non interrompere chi sta scegliendo
      renderStatoRichieste();
      aggiornaFormNavetta();
      if (!_servizioAperto) renderHome();
    }
  } catch (e) { /* silenzioso: riprova al giro successivo */ }
  finally { _inVolo = false; }
}
// Fase della home (giorno, pre-arrivo, dopo partenza): se cambia a pagina aperta
// (mezzanotte, ore 10 del check-out) la home si ridisegna da sola.
let _fase = null;
function faseCorrente() { return [oggiData(), preArrivo(), dopoPartenza()].join('|'); }
function verificaFase() {
  if (!CFG) return;
  const f = faseCorrente();
  if (_fase === null) { _fase = f; return; }
  if (f === _fase) return;
  _fase = f;
  if (_servizioAperto && dopoPartenza()) { tornaHome(); return; }
  if (!_servizioAperto) render();
}
function avviaAggiornamentoStato() {
  _fase = faseCorrente();
  setInterval(verificaFase, 30000);
  setInterval(shPoll, 8000);
  setInterval(() => { if (!_servizioAperto) aggiornaFasce(); }, 30000);   // le fasce orarie cambiano da sole
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificaFase(); });
  _ultimoStato = JSON.stringify([CFG.navetta_corse || [], CFG.orari_occupati || [], CFG.posti_occupati || {}]);
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(() => { if (document.visibilityState === 'visible') aggiornaStato(false); }, 8000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') aggiornaStato(false); });
  window.addEventListener('focus', () => aggiornaStato(false));
  window.addEventListener('online', () => aggiornaStato(false));
}

function cardAutistaHtml(id, nome, foto) {
  const avatar = foto ? '' : esc(nome.trim().slice(0, 1).toUpperCase());
  return `<button type="button" class="driver-card" data-id="${esc(id)}" onclick="scegliAutista('${esc(id)}')">
    <span class="dv-check">${ICONS.CHECK}</span>
    <span class="dv-avatar"${foto ? ` style="background-image:url('${esc(foto)}')"` : ''}>${avatar}</span>
    <span class="dv-nome">${esc(nome)}</span></button>`;
}

function renderNavetta() {
  const p = CFG.prenotazione;
  const sp = CFG.spiaggia;
  const spiagge = CFG.spiagge || [];
  const preavviso = CFG.preavviso_minimo_minuti || 0;
  const nessunoPrenotabile = slotsFasce().every(({ slot }) => slot.every(ora => !slotLibero(ora)));
  orarioScelto = null; autistaScelto = null; personeScelte = null; spiaggiaScelta = '';

  // Nome, telefono e alloggio arrivano gia' dalla prenotazione: si chiedono
  // solo se mancano. La spiaggia e' il primo passo (obbligatoria: l'autista
  // deve sapere dove andare e due gruppi condividono il pulmino solo se vanno
  // alla stessa); se il Calendario l'ha gia' assegnata e' preselezionata.
  const serveTelefono = !(p.telefono || '').trim();
  const spiaggiaNota = (sp && sp.spiaggia_nome) ? sp.spiaggia_nome : '';
  const nomiSpiagge = spiagge.map(x => x.nome);
  if (spiaggiaNota && !nomiSpiagge.some(n => _nn(n) === _nn(spiaggiaNota))) nomiSpiagge.unshift(spiaggiaNota);
  const cardSpiagge = nomiSpiagge.map(n => `<button type="button" class="sp-btn" data-sp="${esc(n)}" onclick="scegliSpiaggia(this.dataset.sp)">${spiaggiaNota && _nn(n) === _nn(spiaggiaNota) ? '<span class="sp-dot"></span>' : ''}${esc(n)}</button>`).join('');

  const autisti = CFG.autisti || [];
  const cardAutisti = autisti.map(a => cardAutistaHtml(a.id, a.nome, a.foto)).join('');

  const fasceTesto = (CFG.fasce || []).map(f => `dalle ${esc(f.dal)} alle ${esc(f.al)}`).join(' e ');
  const introNavetta = CONTENUTI.testi.navetta_testo
    ? esc(CONTENUTI.testi.navetta_testo)
    : `Prenota il rientro dalla spiaggia. Il servizio è attivo ${fasceTesto}.`;

  const haAutisti = autisti.length > 0;
  const nPers = Math.max(1, postiPulmino());
  const numPersone = Array.from({ length: nPers }, (_, i) => i + 1)
    .map(n => `<button type="button" class="num-btn" data-n="${n}" onclick="scegliPersone(${n})">${n}</button>`).join('');
  const nPassoAut = 2, nPassoPers = haAutisti ? 3 : 2, nPassoOra = nPassoPers + 1, nPassoConf = nPassoOra + 1;
  $('#service-content').innerHTML = `
    <div class="card">
      <h2>Servizio navetta</h2>
      <p class="hint" style="white-space:pre-line">${introNavetta}</p>
    </div>
    <div id="navetta-stato-richieste"></div>
    <div class="card" id="navetta-form-card">
      <div class="passo"><span class="n">1</span><h2>Da quale spiaggia?</h2></div>
      <p class="guida">Tocca la spiaggia dove ti devono venire a prendere.</p>
      ${sp && sp.spiaggia_nome ? `<div class="chip-spiaggia">${ICONS.SPIAGGIA}${esc(sp.spiaggia_nome)} · Ombrellone ${esc(sp.ombrellone || '')}</div>` : ''}
      ${nomiSpiagge.length
        ? `<div class="sp-grid" id="sp-grid">${cardSpiagge}</div>${spiaggiaNota ? '<p class="sp-legenda"><span class="sp-dot"></span>La spiaggia della tua prenotazione. Puoi sceglierne un\'altra.</p>' : ''}`
        : `<div class="field"><input type="text" id="f-spiaggia-testo" placeholder="Nome della spiaggia"></div>
           <button type="button" class="submit" style="margin-top:12px" onclick="scegliSpiaggia(($('#f-spiaggia-testo').value || '').trim())">Avanti</button>`}

      ${haAutisti ? `<div id="autista-box" style="display:none">
        <div class="passo" style="margin-top:30px"><span class="n">${nPassoAut}</span><h2>Scegli l'autista</h2></div>
        <p class="guida">Tocca la foto dell'autista che ti verrà a prendere.</p>
        <div class="driver-grid" id="driver-grid">${cardAutisti}</div>
      </div>` : ''}

      <div id="persone-box" style="display:none">
        <div class="passo" style="margin-top:30px"><span class="n">${nPassoPers}</span><h2>Quante persone siete?</h2></div>
        <p class="guida" id="persone-guida">Tocca il numero di persone che tornano con la navetta (compreso te). Il pulmino ha ${nPers} posti.</p>
        <div class="num-grid" id="num-grid">${numPersone}</div>
      </div>

      <div class="passo" id="passo-orario" style="margin-top:30px;display:none"><span class="n">${nPassoOra}</span><h2>Seleziona un orario</h2></div>
      <div id="orari-box" style="display:none">
        <p class="guida">Tocca l'orario in cui vuoi essere riaccompagnato.</p>
        ${nessunoPrenotabile
          ? `<p class="hint">Non ci sono più orari disponibili adesso (servono almeno ${preavviso} minuti di preavviso). Riprova tra poco.</p>`
          : gridSlotHtml(null, 'scegliOrario', null, null, null, '')}
        <div class="sugg-autista" id="sugg-autista" style="display:none"></div>
      </div>

      <div id="passo-conferma" style="display:none">
        <div class="passo" style="margin-top:30px"><span class="n">${nPassoConf}</span><h2>Conferma</h2></div>
        <div class="riepilogo" id="riepilogo"></div>
        ${serveTelefono ? `<div class="field" style="margin-top:16px"><label>Il tuo numero di telefono, così l'autista può chiamarti</label>
          <input type="tel" id="f-telefono" value=""></div>` : ''}
        <div class="errbox" id="errbox"></div>
        <button type="button" class="submit" id="btn-invia" onclick="invia()">Conferma la prenotazione</button>
      </div>
    </div>
    <div class="card" id="navetta-blocco" style="display:none"><h2>Hai già prenotato</h2>
      <p class="hint" style="font-size:16px;line-height:1.5"></p></div>
    <div class="card" id="navetta-conferma-card" style="display:none"></div>
  `;
  if (spiaggiaNota) scegliSpiaggia(spiaggiaNota, true);   // gia' assegnata dal Calendario: preselezionata
  aggiornaGriglieSlot();
  aggiornaBottone();
  renderStatoRichieste();
  aggiornaFormNavetta();
  aggiornaLimitePersone();
}

// Percorso guidato: i passi successivi compaiono man mano che si sceglie.
function vaiA(sel) {
  const el = $(sel);
  if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}
function aggiornaBottone() {
  const btn = $('#btn-invia');
  if (!btn || _invioInCorso) return;
  const haAutisti = (CFG.autisti || []).length > 0;
  const pronto = !!spiaggiaScelta && !!orarioScelto && !!personeScelte && (!haAutisti || !!autistaScelto);
  const box = $('#passo-conferma');
  const eraNascosto = box.style.display === 'none';
  box.style.display = pronto ? 'block' : 'none';
  if (pronto) {
    $('#riepilogo').innerHTML = `<div><span>Ritiro da</span><b>${esc(spiaggiaScelta)}</b></div>
      ${autistaScelto ? `<div><span>Autista</span><b>${esc(autistaScelto)}</b></div>` : ''}
      <div><span>Persone</span><b>${personeScelte}</b></div>
      <div><span>Rientro alle</span><b>${esc(orarioScelto)}</b></div>`;
    if (eraNascosto) vaiA('#passo-conferma');
  }
}

// Dopo ogni scelta si riaggiornano gli orari: quelli che a questo autista, per
// questo gruppo o per questa spiaggia non vanno bene si spengono; se l'orario
// gia' scelto non va piu' bene si propone un altro autista.
function ricontrolla() {
  chiudiSuggerimento();
  const oraPrima = orarioScelto;
  aggiornaGriglieSlot();
  if (oraPrima && autistaPieno(oraPrima, autistaScelto, personeScelte, spiaggiaScelta)) proponiCambioAutista(oraPrima);
  aggiornaBottone();
}

function scegliSpiaggia(nome, silenzioso) {
  if (!nome) return;
  spiaggiaScelta = nome;
  document.querySelectorAll('#sp-grid .sp-btn').forEach(el => el.classList.toggle('selected', _nn(el.dataset.sp) === _nn(nome)));
  const haAutisti = (CFG.autisti || []).length > 0;
  const prossimo = haAutisti ? '#autista-box' : '#persone-box';
  const primaVolta = $(prossimo).style.display === 'none';
  $(prossimo).style.display = 'block';
  if (haAutisti && CFG.autisti.length === 1) { scegliAutista(CFG.autisti[0].id, true); return; }   // un solo autista: nessuna scelta
  ricontrolla();
  if (primaVolta && !silenzioso) vaiA(prossimo);
}

function scegliAutista(id, silenzioso) {
  autistaScelto = ((CFG.autisti || []).find(a => a.id === id) || {}).nome || null;
  document.querySelectorAll('#driver-grid .driver-card').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
  const primaVolta = $('#persone-box').style.display === 'none';
  $('#persone-box').style.display = 'block';
  ricontrolla();
  if (primaVolta && !silenzioso && (CFG.autisti || []).length > 1) vaiA('#persone-box');
}

function scegliPersone(n) {
  personeScelte = n;
  document.querySelectorAll('#num-grid .num-btn').forEach(el => el.classList.toggle('selected', +el.dataset.n === n));
  const primaVolta = $('#orari-box').style.display === 'none';
  $('#orari-box').style.display = 'block';
  $('#passo-orario').style.display = 'flex';
  ricontrolla();
  if (primaVolta) vaiA('#passo-orario');
}

function scegliOrario(ora) {
  if (autistaPieno(ora, autistaScelto, personeScelte, spiaggiaScelta)) { proponiCambioAutista(ora); return; }
  chiudiSuggerimento();
  orarioScelto = ora;
  document.querySelectorAll('#navetta-form-card .slot-btn').forEach(el => el.classList.toggle('selected', el.dataset.ora === ora));
  aggiornaBottone();
}

let _invioInCorso = false;
async function invia() {
  if (_invioInCorso) return;
  const box = $('#errbox');
  box.style.display = 'none';
  const p = CFG.prenotazione;
  const nome = (p.nome || '').trim();
  const telefono = ($('#f-telefono') ? $('#f-telefono').value : p.telefono || '').trim();
  const alloggio = (p.alloggio_nome || '').trim();
  const spiaggia = spiaggiaScelta;
  const autista = autistaScelto || '';
  if (!autista && (CFG.autisti || []).length) {
    box.textContent = 'Scegli l\'autista.';
    box.style.display = 'block';
    return;
  }

  if (!telefono) {
    box.textContent = 'Scrivi il tuo numero di telefono, così l\'autista può chiamarti.';
    box.style.display = 'block';
    return;
  }
  if (!personeScelte) {
    box.textContent = 'Scegli quante persone siete.';
    box.style.display = 'block';
    return;
  }
  if (!orarioScelto) {
    box.textContent = 'Scegli un orario.';
    box.style.display = 'block';
    return;
  }
  if (!spiaggia) {
    box.textContent = 'Scegli la spiaggia da cui devono venirti a prendere: serve all\'autista per sapere dove andare.';
    box.style.display = 'block';
    return;
  }

  if (orariOccupati().has(orarioScelto)) {
    box.textContent = 'Hai già una richiesta attiva a quest\'orario. Scegline un altro oppure cambia quella esistente.';
    box.style.display = 'block';
    return;
  }
  _invioInCorso = true;
  const orarioTentato = orarioScelto;
  const btn = $('#btn-invia');
  btn.disabled = true; btn.textContent = 'Invio in corso…';
  try {
    const d = await chiama({
      azione: 'navetta_prenota',
      nome, telefono, alloggio_nome: alloggio, spiaggia_nome: spiaggia,
      autista_nome: autista, persone: personeScelte, orario: orarioScelto,
    });
    if (d.ok) {
      const orario = orarioScelto, persone = personeScelte;
      await aggiornaStato(true);
      $('#navetta-form-card').style.display = 'none';
      const conferma = $('#navetta-conferma-card');
      conferma.style.display = 'block';
      conferma.innerHTML = `
        <div class="conferma-box">
          <div class="ok">${ICONS.CHECK}Prenotazione confermata</div>
          <div class="big">${esc(orario)}</div>
          <p style="font-size:16px;line-height:1.5">${autista ? `<b>${esc(autista)}</b> verrà` : 'Un autista verrà'} a prendere ${_perPers(persone)} in spiaggia a quest'ora. Se ti serve, puoi cambiare l'orario fino a ${preavvisoModifica()} minuti prima.</p>
          ${puntoRitiroHtml(spiaggia)}
        </div>
        ${personeResidue() > 0 && personeTotali() ? `<button type="button" class="btn-secondary" onclick="renderNavetta()">Prenota anche per le altre ${personeResidue()} ${personeResidue() === 1 ? 'persona' : 'persone'}</button>` : ''}
      `;
      aggiornaFormNavetta();
      return;
    }
    if (['orario_occupato', 'corsa_duplicata', 'persone_esaurite', 'autista_occupato', 'posti_insufficienti'].includes(d.errore)) aggiornaStato(true).then(() => { if (d.errore === 'autista_occupato' || d.errore === 'posti_insufficienti') proponiCambioAutista(orarioScelto || orarioTentato); });
    box.textContent = d.errore === 'orario_non_valido' ? 'Scegli un orario tra quelli disponibili.'
      : d.errore === 'orario_occupato' ? 'Questo orario è appena stato prenotato da un altro ospite. Scegline un altro.'
      : d.errore === 'autista_occupato' || d.errore === 'posti_insufficienti' ? 'Nel frattempo i posti su quell\'orario sono cambiati. Controlla la proposta qui sopra.'
      : d.errore === 'spiaggia_obbligatoria' ? 'Scegli la spiaggia da cui devono venirti a prendere.'
      : d.errore === 'persone_non_valide' ? 'Scegli quante persone siete.'
      : d.errore === 'corsa_duplicata' ? 'Hai già una richiesta attiva a quest\'orario. Scegline un altro oppure cambia quella esistente.'
      : d.errore === 'persone_esaurite' ? 'Le persone della tua prenotazione hanno già una corsa. Potrai prenotare di nuovo quando un ritiro sarà completato o se annulli una corsa.'
      : d.errore === 'autista_obbligatorio' ? 'Scegli l\'autista.'
      : d.errore === 'link_non_valido' ? 'Il link è scaduto. Chiedi alla struttura un nuovo link.'
      : 'Invio non riuscito. Riprova.';
    box.style.display = 'block';
  } catch (e) {
    box.textContent = 'Connessione assente. Controlla la rete e riprova.';
    box.style.display = 'block';
  } finally {
    _invioInCorso = false;
    btn.disabled = false; btn.textContent = 'Conferma la prenotazione';
  }
}

carica();
</script>
</body>
</html>
