<style>
  body { background: var(--gray-50); padding: 0 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  svg { display: block }

  header.top {

    color: #fff; padding: 20px 16px 28px; position: relative; overflow: hidden;
    min-height: 290px; display: flex; flex-direction: column; justify-content: flex-end;
    padding-top: calc(10px + env(safe-area-inset-top));
    border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  }
  @media (min-width: 560px) { header.top { min-height: 330px } }
  /* Sfondo alternato verde / arancione + elemento grafico (sole, raggi, onde, piatto, stella, bolla) */
  header.top.verde   { background: var(--grad-forest); --deco: var(--grad-sun);  --ring: rgba(245,148,95,.6);  --halo: rgba(245,148,95,.22) }
  header.top.arancio { background: var(--grad-sun);    --deco: var(--green-700); --ring: rgba(255,255,255,.7); --halo: rgba(255,255,255,.22) }
  header.top::before, header.top::after { content: ''; position: absolute; pointer-events: none }
  header.top.d-sole::before { right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: var(--deco); animation: anSpin 40s linear infinite }
  header.top.d-sole::after { right: -58px; top: -58px; width: 186px; height: 186px; border-radius: 50%; border: 3px dashed var(--ring) }
  header.top.d-raggi::before { right: -46px; top: -46px; width: 190px; height: 190px; border-radius: 50%;
    background: repeating-conic-gradient(var(--deco) 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%); mask: radial-gradient(circle, transparent 57%, #000 58%);
    animation: anSpin 60s linear infinite }
  header.top.d-raggi::after { right: -4px; top: -4px; width: 108px; height: 108px; border-radius: 50%; background: var(--deco) }
  header.top.d-onde::before { right: -60px; top: -60px; width: 170px; height: 170px; border-radius: 50%; background: var(--deco);
    box-shadow: 0 0 0 20px var(--halo), 0 0 0 46px var(--halo) }
  header.top.d-piatto::before { right: -50px; top: -50px; width: 200px; height: 200px; border-radius: 50%; background: var(--deco);
    box-shadow: inset 0 0 0 16px var(--halo) }
  header.top.d-piatto::after { right: -70px; top: -70px; width: 240px; height: 240px; border-radius: 50%; border: 3px dashed var(--ring) }
  header.top.d-stella::before { right: -34px; top: -34px; width: 180px; height: 180px; background: var(--deco);
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: anSpin 50s linear infinite }
  header.top.d-stella::after { right: 130px; top: 22px; width: 32px; height: 32px; background: var(--ring);
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%) }
  header.top.d-bolla::before { right: -30px; top: -30px; width: 170px; height: 170px; border-radius: 50% 50% 50% 12%; background: var(--deco); transform: rotate(-12deg) }
  header.top.d-bolla::after { right: 138px; top: 26px; width: 22px; height: 22px; border-radius: 50%; background: var(--ring) }
  header.top .hero-img { position: absolute; width: auto; transform-origin: 50% 100%; animation: anBob 3s ease-in-out infinite;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); pointer-events: none }
  header.top .inner { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; width: 100%; flex: 1; display: flex; flex-direction: column }
  header.top .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: auto; padding-bottom: 18px }

  #notif-sheet .pn-vuoto { text-align: center; color: var(--gray-500); font-size: 14.5px; padding: 34px 10px }
  header.top .avatar { width: 38px; height: 38px; border-radius: 50%; background: #fff; flex-shrink: 0;

  .testo-img { width: 100%; border-radius: var(--radius); margin-top: 12px; display: block }
  .link-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; height: 46px; padding: 0 20px;

  .info-body { font-size: 14px; color: var(--gray-700); line-height: 1.6 }

  .info-kv { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px }

  .info-kv span { color: var(--gray-500) }
  .info-kv strong { color: var(--gray-900); font-weight: 700; text-align: right }
  .conto-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--gray-100); font-size: 13.5px; color: var(--gray-700) }
  .conto-row:last-child { border-bottom: none }
  .sg-sum { background: var(--green-700); color: #fff; border-radius: var(--radius-lg); padding: 20px 20px 16px; margin: 4px 0 14px; position: relative; overflow: hidden }
  .sg-sum .al { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--orange-lt) }
  .sg-sum h2 { color: #fff; font-size: 22px; margin: 2px 0 14px }
  .sg-date { display: flex; align-items: center; gap: 12px }

  .sg-date b { display: block; font-size: 19px; font-weight: 800; margin-top: 2px }

  .sg-h h2 { flex: 1; margin: 0; font-size: 17px }

<body>

<script>
const AREA_OSPITE_FN_URL = 'https://area-ospite-113994721180.europe-west1.run.app';

// Foto di default per servizio (file nel repository); l'Hub può sostituirle
// con una foto caricata (CONTENUTI.foto[id], data URL).
const SERVIZI = [
  { id: 'navetta',      icon: 'NAVETTA',      title: 'Navetta',              foto: 'img/navetta.jpg' },
  { id: 'ristorazione', icon: 'RISTORAZIONE', title: 'Ristorazione',         foto: 'img/ristorazione.jpg' },
  { id: 'animazione',   icon: 'ANIMAZIONE',   title: 'Animazione',           foto: 'img/animazione.jpg' },
  { id: 'info',         icon: 'INFO',         title: 'Info utili',           foto: 'img/info.jpg' },
  { id: 'shop',         icon: 'BAG',         title: 'Shop',                 foto: 'img/home.jpg' },
  { id: 'soggiorno',    icon: 'BOOK',         title: 'Il mio soggiorno',     foto: 'img/home.jpg' },
  { id: 'manutenzione', icon: 'WRENCH',      title: 'Segnala un guasto',    foto: 'img/assistenza.jpg' },
];
const FOTO_HOME = 'img/home.jpg';

let CFG = null;
let CONTENUTI = { testi: {}, foto: {}, avvisi: [], avvisi_cfg: {} };
let orarioScelto = null;
let personeScelte = null;
let spiaggiaScelta = '';
let autistaScelto = null;       // null = non ancora scelto; altrimenti il nome dell'autista
let _servizioAperto = null;
let _infoSub = null;            // sotto-argomento aperto dentro "Info utili"
let _editId = null;             // corsa di cui si sta cambiando l'orario
let _editOrario = null;
let _ultimoStato = '';

const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = new URLSearchParams(location.search).get('t') || '';

// Chiamata alla funzione: scade dopo `ms` e, se richiesto, riprova (solo per le letture).
async function chiama(body, { ms = 0, tentativi = 1 } = {}) {
  let ultimo;
  for (let i = 0; i < tentativi; i++) {
    const ac = ms && typeof AbortController !== 'undefined' ? new AbortController() : null;
    const tm = ac ? setTimeout(() => ac.abort(), ms) : null;
    try {
      const r = await fetch(AREA_OSPITE_FN_URL, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, ...body }), signal: ac ? ac.signal : undefined,
      });
      if (r.status >= 500 && i < tentativi - 1) throw new Error('http ' + r.status);
      return await r.json();
    } catch (e) {
      ultimo = e;
      if (i < tentativi - 1) await new Promise(res => setTimeout(res, 1200));
    } finally { if (tm) clearTimeout(tm); }
  }
  throw ultimo;
}

// Se il caricamento e' lento (rete debole, funzione appena riavviata) lo diciamo e offriamo di riprovare.
function avvisoCaricamentoLento() {
  setTimeout(() => {
    const st = $('#stato-caricamento'); if (!st || st.style.display === 'none' || st.querySelector('.lento')) return;
    st.insertAdjacentHTML('beforeend', '<p class="lento" style="margin-top:10px;font-size:13px">Ci sta mettendo più del solito…</p><button type="button" class="lento" onclick="location.reload()" style="margin-top:10px;border:none;border-radius:999px;padding:10px 20px;font:800 14px var(--font);background:var(--green-700);color:#fff;cursor:pointer">Riprova</button>');
  }, 10000);
}

async function carica() {
  hydrateIcons();
  if (!token) return mostraErrore('Link non valido', 'Manca il codice nel link. Usa il link completo che ti ha dato la struttura.');
  avvisoCaricamentoLento();
  try {
    // I contenuti (testi, foto, avvisi) partono in parallelo ma non bloccano la home: se tardano arrivano dopo.
    const pc = chiama({ azione: 'contenuti' }, { ms: 20000, tentativi: 2 }).catch(() => null);
    const d = await chiama({ azione: 'carica' }, { ms: 20000, tentativi: 3 });
    if (!d.ok) {
      if (d.errore === 'link_non_valido') return mostraErrore('Link non valido o scaduto', 'Questo link non è più attivo. Contatta la struttura per riceverne uno nuovo.');
      return mostraErrore('Qualcosa non va', 'Riprova tra poco. Se il problema resta, contatta la struttura.');
    }
    CFG = d;
    if (!CFG.navetta_corse) CFG.navetta_corse = (CFG.navetta_oggi || []).map(c => ({ data: oggiData(), ...c }));
    const applica = c => { if (c && c.ok) CONTENUTI = { testi: c.testi || {}, foto: c.foto || {}, animazione: c.animazione || null, avvisi: c.avvisi || [], avvisi_cfg: c.avvisi_cfg || {}, checkin: c.checkin || null, fasce_banner: c.fasce_banner || null }; return !!(c && c.ok); };
    const c = await Promise.race([pc, new Promise(res => setTimeout(() => res('tardi'), 2500))]);
    const inTempo = c !== 'tardi';
    if (inTempo) applica(c);
    render();
    renderWhatsapp();
    avviaTraduzione();
    avviaAggiornamentoStato();
    if (!inTempo) pc.then(x => { if (applica(x) && !_servizioAperto) render(); });
  } catch (e) {
    mostraErrore('Connessione assente', 'Controlla la connessione e ricarica la pagina.');
  }
}

function mostraErrore(titolo, testo) {
  $('#stato-caricamento').style.display = 'none';
  $('#app').style.display = 'none';
  $('#err-titolo').textContent = titolo;
  $('#err-testo').textContent = testo;
  $('#stato-errore').style.display = 'block';
  hydrateIcons($('#stato-errore'));
}

function fotoServizio(id) {
  const s = SERVIZI.find(x => x.id === id);
  return CONTENUTI.foto[id] || (s ? s.foto : FOTO_HOME);
}
// Ogni sezione ha il suo banner: foto PNG ritagliata, sfondo verde/arancione alternato
// ed elemento grafico diverso (h/r/b = altezza, destra, fondo dell'immagine in px).
const BANNER = {
  home:         { img: 'img/banner/home.png',         tema: 'arancio',   deco: 'raggi',  h: 215, r: -62, b: -54, sw: 150 },
  navetta:      { img: 'img/banner/navetta.png',      tema: 'verde',   deco: 'onde',   h: 172, r: -18, b: -6 },
  ristorazione: { img: 'img/banner/ristorazione.png', tema: 'arancio', deco: 'piatto', h: 185, r: -18, b: -12 },
  animazione:   { img: 'img/gardy.png',               tema: 'verde',   deco: 'sole',   h: 235, r: -86, b: -80 },
  info:         { img: 'img/banner/info.png',         tema: 'arancio', deco: 'stella', h: 205, r: -84, b: -8, sw: 120 },
  shop:         { img: 'img/banner/shop.png',         tema: 'verde',   deco: 'stella', h: 124, r: 4, b: -6, sw: 150 },
  manutenzione: { img: 'img/banner/assistenza.svg',   tema: 'arancio', deco: 'bolla',  h: 185, r: -14, b: 4 },
};
function impostaBanner(id) {
  const b = BANNER[id] || BANNER.home, hd = $('#hero');
  hd.className = `top ${b.tema} d-${b.deco}${id === 'home' || !BANNER[id] ? ' home-top' : ' in-servizio'}${id === 'shop' ? ' in-shop' : ''}`;
  hydrateIcons(hd);
  const im = hd.querySelector('.hero-img');
  im.src = b.img;
  im.style.cssText = `height:${b.h}px;right:${b.r}px;bottom:${b.b}px`;
  $('#sottotitolo').style.maxWidth = b.sw ? b.sw + 'px' : '';
}

function render() {
  const p = CFG.prenotazione;
  const nome = p.nome_proprio || (p.nome || '').trim().split(/\s+/)[0] || 'Ospite';
  // Se l'ospite ha i pasti, scarica il menu in anticipo: quando apre Ristorazione è già pronto.
  if (CFG.ristorazione && !dopoPartenza() && (!_ristoPre || Date.now() - _ristoPre.t > 90000)) ristoPrecarica();
  if (!dopoPartenza()) { if (vis('meteo') || vis('pioggia')) caricaMeteo(); if (vis('ordini')) caricaRistoHome(); }
  $('#avatar').textContent = (nome || '?').slice(0, 1).toUpperCase();
  mostraIntestazioneHome();
  renderHome();
  $('#stato-caricamento').style.display = 'none';
  $('#app').style.display = 'block';
}

function mostraIntestazioneHome() {
  const p = CFG.prenotazione;
  const nome = p.nome_proprio || (p.nome || '').trim().split(/\s+/)[0] || 'Ospite';
  $('#titolo').textContent = `Ciao ${nome}`;
  $('#sottotitolo').textContent = p.alloggio_nome || 'Garden River';
  $('#kicker').textContent = dopoPartenza() ? t('Grazie per aver scelto Garden River') : t('Benvenuto al Garden River');
  impostaBanner('home');
}

// ── Home (card dei servizi) ─────────────────────────────────────────────────
function haContenuto(id) {
  const t = CONTENUTI.testi;
  if (id === 'animazione') return anHaProgramma();
  if (id === 'info') return true;
  return true;
}

function sottotitoloServizio(id) {
  if (id === 'navetta') {
    const attive = (CFG.navetta_corse || []).filter(c => c.data === oggiData() && c.stato === 'in_attesa' || c.stato === 'accettata').length;
    return attive ? `${attive} richiest${attive === 1 ? 'a' : 'e'} in corso` : 'Prenota il rientro dalla spiaggia';
  }
  if (id === 'soggiorno') return 'Conto, spiaggia, ordini e corse';
  if (id === 'manutenzione') return 'Qualcosa non funziona nel tuo alloggio?';
  if (id === 'shop') return 'Ordina e ritira in struttura';
  if (id === 'ristorazione') {
    const r = CFG.ristorazione;
    if (!r) return 'Menu e informazioni';
    return r.trattamento === 'PC' ? 'Pensione completa' : 'Mezza pensione';
  }
  if (id === 'animazione') return haContenuto(id) ? 'Il programma della settimana' : 'Disponibile a breve';
  if (id === 'info') return haContenuto(id) ? 'Orari e informazioni' : 'Disponibile a breve';
  return '';
}


// ── Fondo della home: telefoni utili e social ─────────────────────────────
const HF_ICONE = {
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-1 .4-1.7 1.8-1.7h1.6V3.8c-.3 0-1.3-.2-2.4-.2-2.5 0-4.1 1.5-4.1 4.2v2.7H7.6v3.3h2.8V22z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tripadvisor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="14" r="3.5"/><circle cx="16.5" cy="14" r="3.5"/><circle cx="7.5" cy="14" r=".8" fill="currentColor"/><circle cx="16.5" cy="14" r=".8" fill="currentColor"/><path d="M2.5 9.5c3-2.2 6-3 9.5-3s6.500.8 9.500 3"/></svg>',
};
function renderFooterHome() {
  const el = $('#home-footer'); if (!el) return;
  const t = (CONTENUTI && CONTENUTI.testi) || {}, tel = [];
  const num = s => String(s || '').replace(/[^\d+]/g, '');
  if (t.assistenza_telefono && num(t.assistenza_telefono)) tel.push(['Reception', t.assistenza_telefono]);
  String(t.contatti_testo || '').split('\n').forEach(r => {
    const m = r.split(/\s*[|:]\s*/); const nome = (m[0] || '').trim(), n = (m.slice(1).join(' ') || '').trim();
    if (nome && num(n).length >= 6) tel.push([nome, n]);
  });
  const soc = [['facebook', 'Facebook', t.social_facebook], ['instagram', 'Instagram', t.social_instagram], ['tripadvisor', 'Tripadvisor', t.social_tripadvisor]]
    .filter(([, , u]) => /^https:\/\//i.test(String(u || '').trim()));
  if (!tel.length && !soc.length) {
    el.innerHTML = `<div class="hf"><h3>Siamo qui per te</h3><p>Per qualsiasi bisogno chiedi in reception: siamo a tua disposizione.</p></div>`; return;
  }
  el.innerHTML = `<div class="hf"><h3>Siamo qui per te</h3><p>Chiamaci o seguici: ci trovi anche online.</p>
    ${tel.length ? `<div class="hf-tel">${tel.map(([n, v]) => `<a href="tel:${esc(num(v))}"><span class="ic">${HF_ICONE.tel}</span><span><b>${esc(n)}</b><small>${esc(v)}</small></span></a>`).join('')}</div>` : ''}
    ${soc.length ? `<div class="hf-social"><span>Seguici</span>${soc.map(([k, n, u]) => `<a href="${esc(u.trim())}" target="_blank" rel="noopener" aria-label="${n}">${HF_ICONE[k]}</a>`).join('')}</div>` : ''}</div>`;
}
// ── Lingue ─────────────────────────────────────────────────────────────────
// Italiano e' la lingua di partenza. Le altre (en, de) sono in DIZ (v. fondo): t()
// traduce una frase con eventuali {segnaposto}; traduciDom() ritocca i testi gia' scritti.
let LANG = 'it';
try { const s = localStorage.getItem('gr_lang'); LANG = ['it', 'en', 'de'].includes(s) ? s : (/^de/i.test(navigator.language) ? 'de' : (/^it/i.test(navigator.language) ? 'it' : 'en')); } catch (e) {}
const LOCALE = { it: 'it-IT', en: 'en-GB', de: 'de-DE' };
function t(k, v) {
  let s = (LANG !== 'it' && typeof DIZ !== 'undefined' && DIZ[LANG] && DIZ[LANG][k]) || k;
  if (v) Object.keys(v).forEach(n => { s = s.split('{' + n + '}').join(v[n]); });
  return s;
}

const IC = {

  PIN: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  GO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  X: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  STAR: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.2 6.4 20.3l1.2-6.3L3 9.6l6.3-.8Z"/></svg>',
  WRENCH: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></svg>',
  TICKET: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg>',
  MAP: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>',

// descrizione → accesso in assenza → conferma. Il ticket arriva allo staff
// (Hub, push e gruppo Telegram Manutenzione) segnato come "dall'ospite".
let _mn = {};
const MN_CATEGORIE = [['Elettrico', ICONS.BOLT], ['Idraulico', ICONS.DROP], ['Climatizzazione', ICONS.SNOW], ['Altro', ICONS.WRENCH]];
// Fasce da 30 minuti: 7:30-12:00 e 14:00-17:00.
const MN_FASCE = (() => {
  const out = [], fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  for (const [a, b] of [[450, 720], [840, 1020]]) for (let m = a; m < b; m += 30) out.push(fmt(m) + '-' + fmt(m + 30));
  return out;
})();

function mnMostra(sel) {
  const el = $(sel), prima = el.style.display === 'none';
  el.style.display = 'block';

function mnAggiorna() {
  const ok1 = !!(_mn.alloggio && _mn.nome);
  const b1 = $('#mn-avanti1'); if (b1) b1.disabled = !ok1;
  const b3 = $('#mn-avanti3'); if (b3) b3.disabled = _mn.descrizione.length < 5;

    const prima = conf.style.display === 'none';

async function mnInvia() {

    const d = await chiama({ azione: 'manutenzione_segnala', nome: _mn.nome, alloggio_nome: _mn.alloggio, categoria: _mn.categoria, descrizione: _mn.descrizione, accesso: _mn.accesso === true, animali: _mn.animali === true, fascia: _mn.accesso ? '' : _mn.fascia });

      $('#mn-form').style.display = 'none';
      const c = $('#mn-conferma');
      c.style.display = 'block';
      c.innerHTML = `<div class="conferma-box"><div class="ok">${ICONS.CHECK}Segnalazione inviata</div>
        <p style="font-size:16px;line-height:1.5;margin-top:8px">Abbiamo avvisato il nostro tecnico. ${_mn.accesso ? 'Potrà entrare nell\'alloggio anche se non ci sei.' : 'Ti contatteremo per concordare quando passare.'} Per un'urgenza chiama la reception.</p></div>
        <button type="button" class="btn-secondary" onclick="renderManutenzione()">Segnala un altro guasto</button>`;
      window.scrollTo(0, 0);

    }
    box.textContent = d.errore === 'troppe_segnalazioni' ? 'Hai già inviato molte segnalazioni oggi. Per altro chiama la reception.'
      : d.errore === 'fascia_mancante' ? 'Scegli una fascia oraria per il passaggio del tecnico.'

// ── Shop ────────────────────────────────────────────────────────────────────
// Catalogo e ordini passano dalla Cloud Function ('shop_catalogo', 'shop_prodotto',
// 'shop_ordina', 'shop_ordini'). Il pagamento e' in struttura; il campo
// `pagamento` dell'ordine e' gia' pronto per agganciare PayPal.
// Viste: 'catalogo', 'checkout' (3 passi: carrello, consegna, conferma), 'ordini' (cronologia).
let SH = null;
let SHO = { t: 0, ordini: [], caricando: false };      // ordini mostrati nella card della home
const shEur = n => (Number(n) || 0).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
const shQta = () => SH ? Object.values(SH.cart).reduce((s, q) => s + q, 0) : 0;
const shTot = () => SH.prodotti.reduce((s, p) => s + (SH.cart[p.id] || 0) * p.prezzo, 0);
const SH_STATO = { nuovo: 'Ricevuto', pronto: 'Pronto', consegnato: 'Consegnato', annullato: 'Annullato' };
function shNuovo() { return { cart: {}, cat: '', vista: 'catalogo', step: 1, mod: '', giorno: '', fascia: '', note: '', prodotti: [], categorie: [], cfg: {}, caricato: false, foto: {}, dett: null, invio: false }; }
function shBadge() { const b = $('#shop-badge'); if (!b) return; const q = shQta(); b.textContent = q > 99 ? '99+' : q; b.style.display = q ? 'flex' : 'none'; }
function shAdessoMin() { return SH.oraMin0 == null ? 0 : SH.oraMin0 + Math.floor((Date.now() - SH.t0) / 60000); }
function shData(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}` : ''; }

async function renderShop(vista) {
  SH = SH || shNuovo();
  SH.vista = vista || 'catalogo'; SH.step = 1;
  const box = $('#service-content');
  if (SH.vista === 'ordini') { shBadge(); return shOrdini(box); }
  if (!SH.caricato) {
    box.innerHTML = shSkeleton();
    try {
      const d = await chiama({ azione: 'shop_catalogo' }, { ms: 20000, tentativi: 2 });
      if (_servizioAperto !== 'shop') return;
      if (!d.ok) { box.innerHTML = '<div class="card"><p class="hint">Lo shop non è disponibile. Riprova tra poco.</p></div>'; return; }
      SH.prodotti = d.prodotti || []; SH.categorie = d.categorie || []; SH.cfg = d.cfg || {}; SH.attivo = d.attivo; SH.checkout = d.checkout || '';
      SH.oggi = d.oggi; const [hh, mm] = String(d.ora || '0:0').split(':'); SH.oraMin0 = (+hh) * 60 + (+mm); SH.t0 = Date.now(); SH.caricato = true;
    } catch (e) { if (_servizioAperto === 'shop') box.innerHTML = '<div class="card"><p class="hint">Connessione assente. Controlla la rete e riprova.</p></div>'; return; }
  }
  shDisegna();
}
function shSkeleton() {
  return `<div class="sh-search sk"></div><div class="sh-chips"><span class="sh-sk" style="width:70px;height:48px;border-radius:999px"></span><span class="sh-sk" style="width:110px;height:48px;border-radius:999px"></span><span class="sh-sk" style="width:96px;height:48px;border-radius:999px"></span></div>
    <div class="sh-grid">${'<div class="sh-p"><div class="sh-img sh-sk"></div><div class="sh-info"><span class="sh-sk" style="height:14px;width:80%"></span><span class="sh-sk" style="height:14px;width:40%"></span></div></div>'.repeat(4)}</div>`;
}
function shDisegna() {
  if (_servizioAperto !== 'shop') return;
  shBadge();
  const box = $('#service-content');
  if (SH.vista === 'ordini') return shOrdini(box);
  if (SH.vista === 'checkout') return shCheckout(box);
  if (!SH.attivo || !SH.prodotti.length) { box.innerHTML = `<div class="sh-vuoto"><span>${ICONS.BAG}</span><h2>Shop</h2><p>${SH.attivo ? 'Il catalogo è in preparazione: torna a trovarci presto.' : 'Lo shop non è al momento aperto.'}</p></div>`; return; }
  box.innerHTML = `
    <div class="sh-search"><span>${ICONS.SEARCH}</span><input type="search" id="sh-q" placeholder="Cerca nello shop" value="${esc(SH.q || '')}" oninput="SH.q=this.value;shRes()" enterkeyhint="search"></div>
    ${SH.cfg.messaggio ? `<div class="sh-msg">${esc(SH.cfg.messaggio)}</div>` : ''}
    <div class="sh-chips"><button type="button" class="${SH.cat ? '' : 'on'}" onclick="SH.cat='';shDisegna()">Tutto</button>${SH.categorie.map(c => `<button type="button" class="${SH.cat === c.id ? 'on' : ''}" onclick="SH.cat='${esc(c.id)}';shDisegna()">${esc(c.nome)}</button>`).join('')}</div>
    <div id="sh-res"></div><div id="sh-barra"></div>`;
  shRes(); shBarraAgg();
  hydrateIcons(box);
}
function shCard(p, evid) {
  const id = esc(p.id), n = SH.cart[p.id] || 0, poche = p.giacenza != null && p.giacenza > 0 && p.giacenza <= 3;
  const tag = p.esaurito ? '<span class="sh-tag nero">Esaurito</span>' : (p.novita ? '<span class="sh-tag nuovo">Novità</span>' : (poche ? '<span class="sh-tag poche">Ultimi pezzi</span>' : ''));
  const azione = p.esaurito ? '' : (n
    ? `<div class="sh-qp"><button type="button" onclick="event.stopPropagation();shCambia('${id}',-1)" aria-label="Meno">−</button><b>${n}</b><button type="button" onclick="event.stopPropagation();shCambia('${id}',1)" aria-label="Più">+</button></div>`
    : `<button type="button" class="sh-plus" onclick="event.stopPropagation();shCambia('${id}',1)" aria-label="Aggiungi al carrello">+</button>`);
  return `<div class="sh-p${p.esaurito ? ' fin' : ''}${evid ? ' ev' : ''}" onclick="shDettaglio('${id}')">
    <div class="sh-img"${p.foto ? ` style="background-image:url('${p.foto}')"` : ''}>${p.foto ? '' : ICONS.BAG}${tag}<span class="sh-pz">${shEur(p.prezzo)}</span>${azione}</div>
    <div class="sh-info"><div class="sh-cat">${esc(shCatNome(p.categoriaId))}</div><div class="sh-tit">${esc(p.titolo)}</div></div></div>`;
}
function shCatNome(id) { const c = SH.categorie.find(x => x.id === id); return c ? c.nome : ''; }
function shRes() {
  const el = $('#sh-res'); if (!el) return;
  const q = (SH.q || '').trim().toLowerCase();
  const lista = SH.prodotti.filter(p => (!SH.cat || p.categoriaId === SH.cat) && (!q || (p.titolo + ' ' + p.descrizione).toLowerCase().includes(q)));
  const ev = (!q && !SH.cat) ? SH.prodotti.filter(p => p.evidenza && !p.esaurito) : [];
  el.innerHTML = (ev.length ? `<div class="sh-sez">In evidenza</div><div class="sh-ev">${ev.map(p => shCard(p, true)).join('')}</div><div class="sh-sez">${SH.cat ? esc(shCatNome(SH.cat)) : 'Tutti i prodotti'}</div>` : '')
    + (lista.length ? `<div class="sh-grid">${lista.map(p => shCard(p)).join('')}</div>` : `<div class="sh-vuoto"><span>${ICONS.SEARCH}</span><p>${q ? 'Nessun prodotto trovato.' : 'Nessun prodotto in questa categoria.'}</p></div>`);
  hydrateIcons(el);
}
function shBarraAgg() {
  const el = $('#sh-barra'); if (!el) return;
  const q = shQta();
  if (!q) { el.innerHTML = ''; return; }
  const miniature = SH.prodotti.filter(p => SH.cart[p.id]).slice(0, 3);
  const nuova = !el.firstChild;
  el.innerHTML = `<div class="sh-bar${nuova ? ' nuova' : ''}"><button type="button" class="sh-pill" onclick="shVaiCheckout()">
    <span class="sh-mini">${miniature.map(p => `<i${p.foto ? ` style="background-image:url('${p.foto}')"` : ''}></i>`).join('')}</span>
    <span class="sh-pt"><b>${q} ${q === 1 ? 'articolo' : 'articoli'}</b><small>${shEur(shTot())}</small></span>
    <span class="sh-go">Completa l'ordine ${ICONS.CHEVRON}</span></button></div>`;
}
function shStepper(p, grande) {
  const n = SH.cart[p.id] || 0, id = esc(p.id);
  return n ? `<div class="sh-st${grande ? ' big' : ''}"><button type="button" onclick="shCambia('${id}',-1)" aria-label="Meno">−</button><b>${n}</b><button type="button" onclick="shCambia('${id}',1)" aria-label="Più">+</button></div>`
           : `<button type="button" class="sh-add" onclick="shCambia('${id}',1)">Aggiungi</button>`;
}
function shCambia(id, d) {
  const p = SH.prodotti.find(x => x.id === id); if (!p) return;
  let n = (SH.cart[id] || 0) + d;
  const max = p.giacenza != null ? Math.min(20, p.giacenza) : 20;
  if (n > max) { n = max; shAvviso(p.giacenza != null ? 'Disponibili solo ' + max : 'Massimo ' + max + ' per prodotto'); }
  if (n <= 0) delete SH.cart[id]; else SH.cart[id] = n;
  if (d > 0) { const b = $('#shop-badge'); if (b) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
  if (SH.dett) shDettBarra();
  if (SH.vista === 'catalogo') { shBadge(); shRes(); shBarraAgg(); } else shDisegna();
}
function shAvviso(m) { const e = document.createElement('div'); e.className = 'sh-toast'; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); }

// intestazione: carrello e cronologia
function shApriCarrello() {
  if (_servizioAperto !== 'shop') { apriServizio('shop'); }
  if (!SH) SH = shNuovo();
  shVaiCheckout();
}
function shApriOrdini() {
  if (_servizioAperto !== 'shop') apriServizio('shop');
  shChiudiDett(); renderShop('ordini'); window.scrollTo(0, 0);
}
function shVaiCheckout() { shChiudiDett(); SH.vista = 'checkout'; SH.step = 1; shDisegna(); window.scrollTo(0, 0); }
// freccia "Torna indietro" dell'intestazione
function shIndietro() {
  if (SH.vista === 'checkout' && SH.step > 1) { SH.step--; shDisegna(); }
  else { SH.vista = 'catalogo'; SH.step = 1; renderShop(); }
  window.scrollTo(0, 0);
}

async function shDettaglio(id) {
  const p = SH.prodotti.find(x => x.id === id); if (!p) return;
  SH.dett = id; shDettaglioDisegna();
  if (p.n_foto > 1 && !SH.foto[id]) {
    try { const d = await chiama({ azione: 'shop_prodotto', id }); if (d.ok) { SH.foto[id] = d.foto; if (SH.dett === id) shDettGalleria(); } } catch (e) {}
  }
}
function shDettaglioDisegna() {
  const p = SH.prodotti.find(x => x.id === SH.dett); if (!p) return shChiudiDett();
  let ov = $('#sh-dett');
  if (!ov) { ov = document.createElement('div'); ov.id = 'sh-dett'; ov.className = 'sh-pg'; document.body.appendChild(ov); document.body.style.overflow = 'hidden'; }

    <div id="sh-galw"></div>

      <div class="sh-pgp"><span>${shEur(p.prezzo)}</span>${p.esaurito ? '<em class="sh-tag nero">Esaurito</em>' : (p.novita ? '<em class="sh-tag nuovo">Novità</em>' : (poche ? '<em class="sh-tag poche">Ultimi pezzi</em>' : ''))}</div>
      ${p.descrizione ? `<p class="sh-pgd">${esc(p.descrizione)}</p>` : ''}</div></div>
    <div class="sh-pgbar" id="sh-pgbar"></div>`;
  shDettGalleria(); shDettBarra(); hydrateIcons(ov);

function shDettGalleria() {
  const p = SH.prodotti.find(x => x.id === SH.dett), w = $('#sh-galw'); if (!p || !w) return;
  const foto = SH.foto[p.id] || (p.foto ? [p.foto] : []);
  w.innerHTML = foto.length ? `<div class="sh-gal" onscroll="shDots(this)">${foto.map(f => `<img src="${esc(f)}" alt="">`).join('')}</div>${foto.length > 1 ? `<div class="sh-dots">${foto.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}`
    : `<div class="sh-gal0">${ICONS.BAG}</div>`;
}
function shDots(el) { const i = Math.round(el.scrollLeft / el.clientWidth); document.querySelectorAll('.sh-dots i').forEach((d, k) => d.classList.toggle('on', k === i)); }
function shDettBarra() {
  const p = SH.prodotti.find(x => x.id === SH.dett), b = $('#sh-pgbar'); if (!p || !b) return;
  const n = SH.cart[p.id] || 0;
  b.innerHTML = p.esaurito ? '<p class="hint" style="text-align:center;margin:0"><b>Al momento esaurito</b></p>'
    : n ? `${shStepper(p, true)}<button type="button" class="submit" onclick="shVaiCheckout()">Vai al carrello · ${shEur(shTot())}</button>`
        : `<button type="button" class="submit" onclick="shCambia('${esc(p.id)}',1)">Aggiungi al carrello · ${shEur(p.prezzo)}</button>`;
}
function shChiudiDett() { if (SH) SH.dett = null; const ov = $('#sh-dett'); if (ov) ov.remove(); document.body.style.overflow = ''; }

// ── Checkout a passi ────────────────────────────────────────────────────────
function shPassi() {
  const n = ['Carrello', 'Consegna', 'Conferma'];
  return `<div class="sh-steps">${n.map((l, i) => `<div class="${i + 1 === SH.step ? 'on' : (i + 1 < SH.step ? 'ok' : '')}"${i + 1 < SH.step ? ` onclick="SH.step=${i + 1};shDisegna()"` : ''}><span>${i + 1 < SH.step ? ICONS.CHECK : i + 1}</span>${l}</div>`).join('<i></i>')}</div>`;
}
function shCheckout(box) {

    box.innerHTML = `<div class="sh-vuoto"><span>${ICONS.BAG}</span><h2>Il carrello è vuoto</h2><p>Sfoglia lo shop e aggiungi qualcosa che ti piace.</p>

  }

        <div class="sh-th"${p.foto ? ` style="background-image:url('${p.foto}')"` : ''}>${p.foto ? '' : ICONS.BAG}</div>
        <div class="sh-lb"><div class="sh-lt">${esc(p.titolo)}</div><small>${shEur(p.prezzo)} cad.</small>
          <div class="sh-lr">${shStepper(p)}<b>${shEur(p.prezzo * SH.cart[p.id])}</b></div></div></div>`).join('')}
      <div class="sh-tt"><span>Totale</span><b>${shEur(shTot())}</b></div></div>
      <button type="button" class="submit" onclick="SH.step=2;shDisegna();window.scrollTo(0,0)">Continua</button>
      <button type="button" class="btn-secondary" onclick="SH.vista='catalogo';renderShop()">Continua gli acquisti</button>`;
    hydrateIcons(box); return;
  }
  const c = SH.cfg, ritiro = c.ritiro !== false, consegna = c.consegna !== false;

  if (SH.step === 2) {
    box.innerHTML = `${shPassi()}<div class="card"><h2>Modalità di consegna</h2><p class="guida">Scegli come vuoi ricevere il tuo ordine.</p>
      ${ritiro ? `<label class="sh-mod${SH.mod === 'ritiro' ? ' on' : ''}"><input type="radio" name="shm" ${SH.mod === 'ritiro' ? 'checked' : ''} onchange="SH.mod='ritiro';shDisegna()"><span><b>Ritiro al Bar piscina</b><small>${esc(shOrariRitiro(c.ritiro_orari) || c.ritiro_luogo || 'Passa a ritirarlo quando è pronto')}</small></span></label>` : ''}
      ${consegna ? `<label class="sh-mod${SH.mod === 'consegna' ? ' on' : ''}"><input type="radio" name="shm" ${SH.mod === 'consegna' ? 'checked' : ''} onchange="SH.mod='consegna';shDisegna()"><span><b>Consegna in alloggio</b><small>Te lo portiamo noi, nella fascia oraria che scegli</small></span></label>` : ''}

  box.innerHTML = `${shPassi()}<div class="card"><h2>Riepilogo</h2>
      ${righe.map(p => `<div class="sh-rl"><span>${SH.cart[p.id]} × ${esc(p.titolo)}</span><b>${shEur(p.prezzo * SH.cart[p.id])}</b></div>`).join('')}
      <div class="sh-tt"><span>Totale</span><b>${shEur(shTot())}</b></div></div>
    <div class="card"><h2>Modalità di consegna</h2><p style="font-weight:700;font-size:15px;margin:6px 0 0">${esc(dest)}</p>
      <div class="field" style="margin-top:12px"><label for="sh-note">Note (facoltative)</label><textarea id="sh-note" rows="2" maxlength="300" style="width:100%;padding:12px;border:2px solid var(--gray-300);border-radius:var(--radius);font:inherit;font-size:16px" oninput="SH.note=this.value">${esc(SH.note || '')}</textarea></div>
      <p class="hint">${SH.mod === 'consegna' && SH.pag === 'carta' ? (SH.cfg.carta_api ? 'Pagamento online gestito dalla piattaforma PayPal, non rimborsabile: nel passo successivo inserisci i dati della carta e accetti le condizioni.' : 'Pagamento con carta online: dopo l\'invio ti portiamo su PayPal.') : 'Pagamento ' + (SH.mod === 'consegna' ? 'in contanti alla consegna' : 'al ritiro') + '.'}</p>
      <div class="errbox" id="sh-err" style="display:none"></div></div>
    <button type="button" class="submit" id="sh-invia" onclick="shInvia()">${SH.mod === 'consegna' && SH.pag === 'carta' && SH.cfg.carta_api ? 'Vai al pagamento' : 'Invia l\'ordine'}</button>
    <button type="button" class="btn-secondary" onclick="SH.step=2;shDisegna()">Indietro</button>`;
}
function shPronto2() { return SH.mod === 'ritiro' || (SH.mod === 'consegna' && SH.giorno && SH.fascia && SH.pag); }
function shAvanti2() { if (!shPronto2()) return; SH.step = 3; shDisegna(); window.scrollTo(0, 0); }
function shPagamentoHtml() {
  const min = Number(SH.cfg.carta_min != null ? SH.cfg.carta_min : 5), sotto = !!SH.cfg.carta_api && shTot() + 1e-9 < min;
  if (!SH.cfg.carta || sotto) { if (SH.pag === 'carta') SH.pag = ''; if (!SH.cfg.carta || sotto) SH.pag = SH.pag || 'contanti'; }
  const op = (v, t, s, dis) => `<label class="sh-mod${SH.pag === v ? ' on' : ''}"${dis ? ' style="opacity:.55;cursor:default"' : ''}><input type="radio" name="shp" ${SH.pag === v ? 'checked' : ''}${dis ? ' disabled' : ''} onchange="SH.pag='${v}';shDisegna()"><span><b>${t}</b><small>${s}</small></span></label>`;
  const carta = !SH.cfg.carta ? '' : SH.cfg.carta_api
    ? op('carta', 'Carta di credito o debito', sotto ? `<b style="color:var(--orange)">Ti mancano ${shEur(min - shTot())}</b> per sbloccare il pagamento con carta (minimo ${shEur(min)}).<span class="pp-bar"><i style="width:${Math.max(4, Math.min(100, Math.round(shTot() / min * 100)))}%"></i></span><button type="button" class="pp-add" onclick="event.preventDefault();event.stopPropagation();SH.vista='catalogo';SH.step=1;shDisegna();window.scrollTo(0,0)">Aggiungi altri prodotti</button>` : 'Paghi subito tramite PayPal (Visa, Mastercard, Maestro). Pagamento non rimborsabile', sotto)

  return `<div class="card"><h2>Come vuoi pagare?</h2>
    ${op('contanti', 'Contanti alla consegna', 'Paghi quando ricevi l\'ordine')}${carta}</div>`;
}
function shOrariRitiro(iv) {
  if (!Array.isArray(iv) || !iv.length) return '';
  return 'Ritiro ' + iv.map(r => `${String(r[0]).replace(/^0/, '')} – ${String(r[1]).replace(/^0/, '')}`).join(' e ');
}

// ── Pagamento con carta (PayPal) ────────────────────
// I dati della carta vivono in iframe di PayPal: non passano dal nostro sito ne' dal nostro server.
// Si paga PRIMA: l'ordine (gia' creato ma nascosto) diventa visibile solo a pagamento riuscito.
let _ppSdk = null;
function shCaricaPaypal() {
  if (_ppSdk) return _ppSdk;
  _ppSdk = new Promise((ok, ko) => {
    if (window.paypal && window.paypal.CardFields) return ok();
    const x = document.createElement('script');
    x.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(SH.cfg.paypal_client_id) + '&components=card-fields&currency=EUR&intent=authorize&locale=it_IT';
    x.onload = ok; x.onerror = () => { _ppSdk = null; ko(new Error('sdk')); };
    document.head.appendChild(x);
  });
  return _ppSdk;
}
function shCondizioniHtml() {
  const v = SH.cfg.venditore ? esc(SH.cfg.venditore) : 'la struttura Garden River';
  return `<details class="pp-cond"><summary>Leggi le condizioni di pagamento</summary>
    <p><b>Venditore.</b> ${v}.</p>
    <p><b>Pagamento non rimborsabile.</b> Il pagamento con carta è definitivo: dopo il pagamento l'ordine non può essere annullato dall'ospite e l'importo non viene rimborsato.</p>
    <p><b>Diritti di legge.</b> Restano salvi i diritti che la legge riconosce al consumatore: se un prodotto non è disponibile, non viene consegnato o risulta difettoso o non conforme, rimborsiamo l'importo o lo sostituiamo. Il diritto di recesso non si applica ai beni che rischiano di deteriorarsi o scadere rapidamente e ai beni sigillati aperti per motivi igienici (art. 59 D.Lgs. 206/2005).</p>
    <p><b>Piattaforma di pagamento.</b> Il pagamento è gestito da PayPal. I dati della carta sono trattati direttamente da PayPal secondo le sue condizioni e la sua informativa privacy: la struttura non li riceve e non li conserva. Alla struttura restano i dati dell'ordine e l'esito del pagamento.</p>
    <p><b>Ordine e consegna.</b> Il prezzo è quello mostrato nel riepilogo, in euro, IVA inclusa. La consegna avviene nella fascia scelta oppure il ritiro al Bar piscina negli orari indicati.</p>
    <p><b>Assistenza.</b> Per qualsiasi problema con un ordine rivolgiti alla reception.</p></details>`;
}
async function ppCrea(id) { const d = await chiama({ azione: 'shop_paypal_crea', id, accetta: true }, { ms: 20000 }); if (!d.ok) { const e = new Error(d.errore || 'crea'); e.cod = d.errore; throw e; } return d.paypal_order_id; }
const PP_CIRC = { AMEX: 'American Express', DISCOVER: 'Discover', JCB: 'JCB', DINERS: 'Diners', CHINA_UNION_PAY: 'UnionPay', ELECTRON: 'Visa Electron' };
function ppMsg(cod, d) {
  const circ = d && d.circuito ? (PP_CIRC[d.circuito] || d.circuito) : '';
  return cod === 'carta_non_accettata' ? (circ ? 'Le carte ' + circ + ' non sono accettate' : 'Questa carta non è accettata') + ': usa una carta Visa, Mastercard o Maestro, oppure scegli contanti.'
    : cod === 'condizioni_non_accettate' ? 'Per pagare devi accettare le condizioni di pagamento.'
    : cod === 'gia_pagato' ? 'Questo ordine risulta già pagato.'
    : cod === 'carta_importo_minimo' ? 'Il pagamento online è disponibile solo per ordini di importo maggiore. Scegli contanti.'
    : 'Pagamento non riuscito. Controlla i dati e riprova, oppure usa un\'altra carta.' + (d && d.motivo ? ' (' + d.motivo + ')' : '');
}
async function shPagaCarta(id, tot, attesa) {
  const box = $('#service-content'), min = Number(SH.cfg.carta_min != null ? SH.cfg.carta_min : 5);
  box.innerHTML = `<div class="card"><h2>Pagamento</h2><div class="pp-tot">${shEur(tot)}</div>
    <label class="pp-lbl" for="pp-name">Intestatario</label><div class="pp-f" id="pp-name"></div>
    <label class="pp-lbl">Numero della carta</label><div class="pp-f" id="pp-num"></div>
    <div class="pp-2"><div><label class="pp-lbl">Scadenza</label><div class="pp-f" id="pp-exp"></div></div><div><label class="pp-lbl">CVV</label><div class="pp-f" id="pp-cvv"></div></div></div>
    <label class="pp-acc"><input type="checkbox" id="pp-acc"><span>Ho letto e accetto le condizioni di pagamento: <b>il pagamento con carta non è rimborsabile</b>, salvi i diritti di legge del consumatore.</span></label>
    ${shCondizioniHtml()}
    <div class="errbox" id="pp-err" style="display:none;margin-top:14px"></div>
    <div class="pp-sic">${ICONS.LOCK || ICONS.CHECK}<span>Pagamento sicuro gestito da PayPal. I dati della carta vanno direttamente a PayPal: noi non li vediamo e non li salviamo. Carte accettate: Visa, Mastercard e Maestro.</span></div></div>
    <button type="button" class="submit" id="pp-paga" disabled>Paga ${shEur(tot)}</button>
    <button type="button" class="btn-secondary" style="margin-top:8px" id="pp-ind">${attesa ? 'Annulla e torna al carrello' : 'Più tardi'}</button>`;
  $('#pp-ind').onclick = async () => {
    if (!attesa) return shApriOrdini();
    $('#pp-ind').disabled = true;
    try { await chiama({ azione: 'shop_annulla_attesa', id }, { ms: 15000 }); } catch (e) {}
    SH.caricato = false; SH.vista = 'checkout'; SH.step = 3; renderShop('checkout');
  };
  const err = m => { const e = $('#pp-err'); if (e) { e.textContent = m; e.style.display = 'block'; } }, btn = $('#pp-paga');
  const accettato = () => { const c = $('#pp-acc'); return !!(c && c.checked); };
  const nonAccettato = () => { err('Per pagare spunta prima l\'accettazione delle condizioni di pagamento.'); const c = $('#pp-acc'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  const ripristina = () => { if (btn.isConnected) { btn.disabled = !accettato(); btn.textContent = 'Paga ' + shEur(tot); } };
  $('#pp-acc').onchange = () => { if (btn.textContent.startsWith('Paga')) btn.disabled = !accettato(); const e = $('#pp-err'); if (e && accettato()) e.style.display = 'none'; };
  const fatto = () => {
    if (attesa) { SH.cart = {}; SH.note = ''; SH.fascia = ''; shBadge(); }
    SH.caricato = false; SH.vista = 'catalogo'; SH.step = 1; SHO.t = 0;
    $('#service-content').innerHTML = `<div class="conferma-box"><div class="ok">${ICONS.CHECK}Pagamento riuscito</div>
      <p style="font-size:16px;line-height:1.5;margin-top:8px">Abbiamo ricevuto ${shEur(tot)}. Il tuo ordine è stato inviato: ti avvisiamo qui quando è in arrivo. Il pagamento con carta non è rimborsabile; per qualsiasi problema rivolgiti alla reception.</p>
      <button type="button" class="submit" style="margin-top:14px" onclick="shApriOrdini()">Segui il tuo ordine</button></div>`;
    window.scrollTo(0, 0);
  };
  const cattura = async oid => {
    const d = await chiama({ azione: 'shop_paypal_cattura', id, paypal_order_id: oid }, { ms: 40000 });
    if (d.ok) return fatto();
    ripristina(); err(ppMsg(d.errore, d));
  };
  try { await shCaricaPaypal(); } catch (e) { return err('Non riesco a collegarmi a PayPal. Controlla la rete e riprova.'); }
  if (!$('#pp-paga')) return;                                     // l'ospite ha cambiato schermata
  const pp = window.paypal;
  const cf = pp.CardFields({
    // PayPal ammette solo poche proprieta' negli iframe (niente border, height, line-height): il riquadro lo disegna la pagina, qui si toglie solo l'outline interno
    style: { input: { 'font-size': '16px', 'font-family': 'sans-serif', color: '#1f2937', padding: '0 14px', outline: 'none', background: 'transparent' }, ':focus': { outline: 'none' }, '.invalid': { color: '#B42318', outline: 'none' } },
    createOrder: () => ppCrea(id),
    onApprove: d => cattura(d.orderID),
    onError: e => { console.error('PayPal CardFields onError', e); ripristina(); err('Pagamento non riuscito. Controlla i dati della carta o prova con un\'altra carta.'); },
  });
  if (!cf.isEligible()) return err('Il pagamento con carta non è al momento disponibile. Torna indietro e scegli contanti.');
  const ev = nome => ({ onFocus: () => $('#' + nome) && $('#' + nome).classList.add('on'), onBlur: () => $('#' + nome) && $('#' + nome).classList.remove('on'),
    onChange: d => { const f = d && d.fields && d.fields[d.emittedBy]; const el = $('#' + nome); if (el && f) el.classList.toggle('ko', f.isValid === false && f.isPotentiallyValid === false); } });
  cf.NameField({ placeholder: 'Nome e cognome', inputEvents: ev('pp-name') }).render('#pp-name');
  cf.NumberField({ placeholder: '1234 1234 1234 1234', inputEvents: ev('pp-num') }).render('#pp-num');
  cf.ExpiryField({ placeholder: 'MM/AA', inputEvents: ev('pp-exp') }).render('#pp-exp');
  cf.CVVField({ placeholder: '123', inputEvents: ev('pp-cvv') }).render('#pp-cvv');
  btn.disabled = !accettato();
  btn.onclick = () => { if (!accettato()) return nonAccettato(); btn.disabled = true; btn.textContent = 'Pagamento in corso…'; $('#pp-err').style.display = 'none'; cf.submit().catch(() => { ripristina(); err('Controlla i dati della carta e riprova.'); }); };
}

// ── Cronologia e stato ordini ───────────────────────────────────────────────
function shTestoStato(o) {
  if (o.stato === 'nuovo') return 'Ricevuto, lo stiamo preparando';
  if (o.stato === 'pronto') return o.modalita === 'consegna' ? 'Pronto: te lo portiamo a breve' : 'Pronto: passa a ritirarlo al Bar piscina';
  if (o.stato === 'consegnato') return 'Consegnato';
  return 'Annullato';
}
function shProgresso(o) {
  if (o.stato === 'annullato') return '';
  const i = { nuovo: 0, pronto: 1, consegnato: 2 }[o.stato] ?? 0, et = ['Ricevuto', 'Pronto', o.modalita === 'consegna' ? 'Consegnato' : 'Ritirato'];
  return `<div class="sh-prog">${et.map((l, k) => `<div class="${k < i || (k === i && i === 2) ? 'ok' : (k === i ? 'now' : '')}"><span>${k < i || (k === i && i === 2) ? ICONS.CHECK : ''}</span>${l}</div>`).join('')}</div>`;
}
function shDoveQuando(o) {
  return o.modalita === 'consegna' ? `Consegna in alloggio${o.consegna_fascia ? ` · ${shData(o.consegna_data)} ${o.consegna_fascia.replace('-', ' – ')}` : ''}` : 'Ritiro al Bar piscina' + (SHO.orari && SHO.orari.length ? ' · ' + shOrariRitiro(SHO.orari).replace('Ritiro ', '') : '');
}
async function shOrdini(box, silente) {
  if (!silente) box.innerHTML = '<div class="card"><p class="hint">Carico i tuoi ordini…</p></div>';
  let d; try { d = await chiama({ azione: 'shop_ordini' }, { ms: 20000, tentativi: silente ? 1 : 2 }); } catch (e) { d = null; }
  if (_servizioAperto !== 'shop' || !SH || SH.vista !== 'ordini') return;
  if (d && d.ok) { SHO.ordini = d.ordini; SHO.orari = d.ritiro_orari || []; SHO.t = Date.now(); }
  const firma = JSON.stringify(d && d.ok ? [d.ordini, d.ritiro_orari] : 0);
  if (silente && (!d || !d.ok || firma === SH.ordFirma)) return;        // niente cambiato: non ridisegno
  SH.ordFirma = firma;
  const att = d && d.ok ? d.ordini.filter(o => o.stato === 'nuovo' || o.stato === 'pronto') : [], resto = d && d.ok ? d.ordini.filter(o => !(o.stato === 'nuovo' || o.stato === 'pronto')) : [];
  const card = o => `<div class="sh-or ${esc(o.stato)}"><div class="sh-oh"><b>${shEur(o.totale)}</b><span class="sh-st-${esc(o.stato)}">${esc(SH_STATO[o.stato] || o.stato)}</span></div>
    ${shProgresso(o)}<div class="sh-ost">${esc(shTestoStato(o))}</div>
    <div class="hint" style="margin:6px 0 2px">${o.righe.map(r => esc(r.quantita + ' × ' + r.titolo)).join(' · ')}</div>
    <div class="hint">${esc(shDoveQuando(o))} · ${(o.pagamento || {}).stato === 'pagato' ? 'Pagato' : 'Da pagare'} · ${esc(new Date(o.creato_il).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }))}</div>
    ${o.ha_foto ? `<button type="button" class="btn-secondary" style="margin-top:10px" onclick="shFotoConsegna('${esc(o.id)}',this)">Vedi la foto di dove abbiamo lasciato l'ordine</button>` : ''}
    ${o.paga_carta ? `<button type="button" class="btn-secondary" style="margin-top:10px" onclick="shPagaCarta('${esc(o.id)}',${Number(o.totale) || 0})">Paga ora con carta</button>` : ''}
    ${o.paypal_url ? `<a class="btn-secondary" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${esc(o.paypal_url)}" target="_blank" rel="noopener">Paga con PayPal</a>` : ''}</div>`;
  box.innerHTML = !d || !d.ok ? '<div class="card"><p class="hint">Non riesco a caricare gli ordini ora.</p></div>'
    : `${att.length ? `<div class="card"><h2>In corso</h2>${att.map(card).join('')}</div>` : ''}
       <div class="card"><h2>Cronologia</h2>${resto.length ? resto.map(card).join('') : `<p class="hint">${att.length ? 'Nessun ordine concluso.' : 'Non hai ancora fatto ordini.'}</p>`}</div>`;
  box.insertAdjacentHTML('beforeend', '<button type="button" class="btn-secondary" onclick="SH.vista=\'catalogo\';renderShop()">Torna allo shop</button>');
  hydrateIcons(box);
}

// ── Card «stato ordini» nella home ──────────────────────────────────────────
async function shopHomeCarica() {
  if (!CFG || !CFG.shop_attivo || SHO.caricando) return;
  const attivi = (SHO.ordini || []).some(o => o.stato === 'nuovo' || o.stato === 'pronto');
  if (Date.now() - SHO.t < (attivi ? 6000 : 60000)) return;
  SHO.caricando = true;
  try {
    const d = await chiama({ azione: 'shop_ordini' }, { ms: 15000 });
    if (d && d.ok) { const prima = JSON.stringify(SHO.ordini); SHO.ordini = d.ordini; SHO.orari = d.ritiro_orari || []; if (prima !== JSON.stringify(d.ordini) && !_servizioAperto) renderHomeExtra(); }
  } catch (e) {} finally { SHO.caricando = false; SHO.t = Date.now(); }
}
// aggiornamento automatico: cronologia aperta oppure home con ordini in corso
function shPoll() {
  if (document.visibilityState !== 'visible' || !CFG || !CFG.shop_attivo) return;
  if (_servizioAperto === 'shop') { if (SH && SH.vista === 'ordini' && !SH.dett) shOrdini($('#service-content'), true); return; }
  if (!_servizioAperto) shopHomeCarica();
}
function shopHomeHtml() {
  if (!CFG || !CFG.shop_attivo || preArrivo()) return '';
  const att = (SHO.ordini || []).filter(o => o.stato === 'nuovo' || o.stato === 'pronto'); if (!att.length) return '';
  return `<div class="sez">${esc(t('I tuoi ordini'))}</div>` + att.map(o => {
    const n = o.righe.reduce((x, r) => x + (r.quantita || 0), 0), pronto = o.stato === 'pronto';
    return `<div class="sh-hc${pronto ? ' pronto' : ''}" onclick="shApriOrdini()">
      <div class="sh-hh"><span class="sh-hi">${ICONS.BAG}</span><div><b>${esc(pronto ? t('Il tuo ordine è pronto') : t('Ordine in preparazione'))}</b><small>${esc(shEur(o.totale))} · ${n} ${n === 1 ? 'articolo' : 'articoli'}</small></div></div>
      ${shProgresso(o)}
      <div class="sh-hd">${esc(shTestoStato(o))}</div><div class="sh-hw">${esc(shDoveQuando(o))}</div>
      <div class="sh-hl">${esc(t('Segui l\'ordine'))} ${ICONS.CHEVRON}</div></div>`;
  }).join('');
}

// ── Ristorazione ──────────────────────────────────────────────────────────
// Menu e ordini vivono dentro l'Area ospite: i dati arrivano dalla Cloud
// Function (azione 'ristorazione_menu', una sola chiamata) e l'ordine parte con
// 'ristorazione_ordina', che ricontrolla quote, mezza pensione e orario limite.
let RS = null, _ristoPre = null, _rsVistaIniz = null;
const RS_GRUPPI = { 'Primi Carne': ['Primi Carne', 'Primi Pesce'], 'Primi Pesce': ['Primi Carne', 'Primi Pesce'],
                    'Secondi Carne': ['Secondi Carne', 'Secondi Pesce'], 'Secondi Pesce': ['Secondi Carne', 'Secondi Pesce'] };
function ristoPrecarica() { _ristoPre = { t: Date.now(), p: chiama({ azione: 'ristorazione_menu' }).catch(() => null) }; }
let _ristoCache = null;
async function ristoDati(forza) {
  if (!forza && _ristoCache && Date.now() - _ristoCache.t < 60000) return _ristoCache.d;
  let d = null;
  if (!forza && _ristoPre && Date.now() - _ristoPre.t < 90000) { d = await _ristoPre.p; _ristoPre = null; }
  if (!d || !d.ok) d = await chiama({ azione: 'ristorazione_menu' });
  if (d && d.ok) _ristoCache = { t: Date.now(), d };
  return d;
}
const rsTipi = data => { const t = {}; (RS.d.menu[data] || []).forEach(m => { (t[m.tipo] = t[m.tipo] || []).push(m); }); return t; };
const rsScaduto = iso => iso < RS.d.oggi || (iso === RS.d.oggi && RS.d.chiusura_oggi);
const rsSel = key => RS.sel[key] || (RS.sel[key] = { piatti: {}, bambini: {}, note: '' });
const rsTotBamb = key => Object.values(rsSel(key).bambini).reduce((s, v) => s + (v || 0), 0);
const rsTotKey = key => Object.values(rsSel(key).piatti).reduce((s, v) => s + (v || 0), 0) + rsTotBamb(key);
function rsTotGruppo(key, cat, piatti) {
  const cats = RS_GRUPPI[cat] || [cat], ids = new Set(piatti.filter(p => cats.includes(p.categoria)).map(p => p.id));
  return Object.entries(rsSel(key).piatti).filter(([id, q]) => ids.has(id) && q > 0).reduce((s, [, q]) => s + q, 0);
}
function rsDomani() { const d = new Date(RS.d.oggi + 'T12:00:00'); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }
function rsLabelData(iso) {
  const [y, m, g] = iso.split('-').map(Number), d = new Date(y, m - 1, g);
  const GG = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  const MM = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  const inArrivo = RS.d.famiglia.checkin && RS.d.famiglia.checkin > RS.d.oggi;   // non ancora arrivato: si parte dal giorno di arrivo
  const pre = inArrivo ? (iso === RS.d.giorni[0] ? 'Arrivo' : 'Giorno dopo') : (iso === RS.d.oggi ? 'Oggi' : (iso === rsDomani() ? 'Domani' : 'Arrivo'));
  return `${pre} · ${GG[d.getDay()]} ${g} ${MM[m - 1]}`;
}
function rsRecupero() {
  const f = RS.d.famiglia;
  if (f.trattamento !== 'PC' || f.checkout !== RS.d.oggi || RS.d.chiusura_oggi) return [];
  return f.ora_arrivo === 'dopo_pranzo' ? ['pranzo'] : (f.ora_arrivo === 'sera' ? ['pranzo', 'cena'] : []);
}
function rsToast(m) {
  let t = document.getElementById('rs-toast');
  if (!t) { t = document.createElement('div'); t.id = 'rs-toast'; document.body.appendChild(t); }
  t.textContent = m; t.classList.add('show'); clearTimeout(rsToast._t); rsToast._t = setTimeout(() => t.classList.remove('show'), 2800);
}

async function renderRistorazione(keep) {
  const vistaPrec = keep && RS ? RS.vista : null;
  const r = CFG.ristorazione, panel = $('#service-content');
  if (!r) { renderRistoranteLibero(panel); return; }
  panel.innerHTML = '<div class="rs-load"><span></span><span></span><span></span></div>';
  try {
    const d = await ristoDati();
    if (_servizioAperto !== 'ristorazione') return;
    if (!d || !d.ok) throw new Error((d && d.errore) || 'errore');
    RS = { d, sel: {}, mp: {}, vista: _rsVistaIniz || vistaPrec || 'home' }; _rsVistaIniz = null;
    rsDisegna();
  } catch (e) {
    if (_servizioAperto !== 'ristorazione') return;
    panel.innerHTML = `<div class="card"><div class="soon-box"><h3>Non riesco a caricare il menu</h3><p>Controlla la connessione e riprova.</p>
      <button type="button" class="rs-retry" onclick="renderRistorazione(true)">Riprova</button></div></div>`;
  }
}

const rsTile = (cls, ic, ey, titolo, sotto, fn, cta, pill) => `<button type="button" class="rs-tile ${cls}" onclick="${fn}">${pill ? `<span class="pill">${esc(pill)}</span>` : ''}<span class="ic">${ic}</span>${ey ? `<span class="ey">${esc(ey)}</span>` : ''}<b>${titolo}</b><small>${esc(sotto)}</small><span class="cta">${esc(cta)}${ICONS.CHEVRON}</span></button>`;

function rsApriMenu() {
  if (document.getElementById('rs-menu-ov')) return;
  const ov = document.createElement('div'); ov.id = 'rs-menu-ov';
  ov.innerHTML = `<div class="bar"><h2>Menu alla carta</h2><button type="button" class="chiudi" onclick="rsChiudiMenu()">${ICONS.CLOSE}Chiudi</button></div>
    <div class="corpo">${[1, 2, 3, 4].map(n => `<img src="img/carta/pagina-${n}.jpg" alt="Menu alla carta, pagina ${n}" loading="lazy">`).join('')}
      <a class="submit" style="display:block;text-align:center;text-decoration:none;line-height:52px;margin-top:6px" href="../ristorazione/menu-alla-carta.pdf" target="_blank" rel="noopener">Apri il menu in PDF</a></div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
}
function rsChiudiMenu() { const ov = document.getElementById('rs-menu-ov'); if (ov) ov.remove(); document.body.style.overflow = ''; }
function rsVai(v) {
  if (v === 'carta') { rsApriMenu(); return; } RS.vista = v; rsDisegna(); window.scrollTo(0, 0); }
function rsRiepilogo() {
  const d = RS.d, f = d.famiglia, nome = f.trattamento === 'PC' ? 'Pensione completa' : 'Mezza pensione';
  const dom = new Date(d.oggi + 'T12:00:00'); dom.setDate(dom.getDate() + 1); const domani = dom.toISOString().slice(0, 10);
  const nm = x => x === 'pranzo' ? 'pranzo' : (x === 'cena' ? 'cena' : 'un pasto');
  let titolo, testo, n = 0;
  if (d.giorni[0] > d.oggi) { const m = rsMancanti(d, d.giorni[0]); n = m.length; titolo = n ? 'Scegli i pasti del tuo arrivo' : 'Pasti di arrivo scelti'; testo = n ? `Ti manca: ${m.map(nm).join(' e ')}.` : 'Hai già ordinato tutto per il giorno di arrivo.'; }
  else {
    const mo = d.giorni.includes(d.oggi) && !d.chiusura_oggi ? rsMancanti(d, d.oggi) : [], md = d.giorni.includes(domani) ? rsMancanti(d, domani) : [];
    n = mo.length + md.length;
    titolo = n ? 'Hai dei pasti da scegliere' : 'Pasti in ordine';
    testo = [mo.length ? `Oggi ti manca ${mo.map(nm).join(' e ')} (si ordina entro le 8:30).` : '', md.length ? `Per domani devi ancora scegliere ${md.map(nm).join(' e ')}.` : ''].filter(Boolean).join(' ') || 'Hai ordinato tutto quello che puoi ordinare per ora.';
  }
  return { nome, titolo, testo, n };
}
function rsDisegna() {
  const d = RS.d, v = RS.vista || 'home', panel = $('#service-content');
  if (v === 'pasti') { panel.innerHTML = rsPasti(); return; }
  if (v === 'tavolo') {
    panel.innerHTML = `<p class="rs-sub" style="margin-top:14px">Vuoi mangiare fuori dal tuo trattamento, per esempio un pasto in più? Prenota qui il tuo tavolo.</p>${ptCard()}`;
    ptInit(true); return;
  }
  const R = rsRiepilogo();
  panel.innerHTML = `
    <div class="rs-hub">
      ${rsTile('', ICONS.UTENSILS, R.nome, R.titolo, R.testo, "rsVai('pasti')", R.n ? 'Ordina i pasti' : 'Vedi i tuoi ordini', R.n ? `${R.n} da fare` : '')}
      ${rsTile('arancio', ICONS.CALENDAR, 'Un pasto in più?', 'Prenota un tavolo', 'Scegli giorno, turno e persone: ti aspettiamo al ristorante.', "rsVai('tavolo')", 'Prenota')}
      ${rsTile('chiaro', ICONS.BOOK, 'Sempre disponibile', 'Menu alla carta', 'Sfoglia tutti i piatti del ristorante.', "rsVai('carta')", 'Sfoglia il menu')}
    </div>
    <div class="card rs-orari"><h2>Orari del ristorante</h2>
      <p><b>Colazione</b> 8:00 – 10:00 · <b>Pranzo</b> 13:00 – 14:30 · <b>Cena</b> 20:00 – 22:00</p>
      <p>Il lunedì sera è serata sushi. Per intolleranze, allergie o menù vegetariano/vegano contatta lo staff in anticipo.</p></div>`;
}
function rsPasti() {
  const d = RS.d, rec = rsRecupero();
  const giorni = rec.length ? [d.oggi] : d.giorni.filter((g, i) => i === 0 || !d.famiglia.checkout || d.famiglia.checkout > d.oggi);
  return `<div id="rs-root">${giorni.map(g => `<section id="rs-day-${g}">${rsGiorno(g)}</section>`).join('')}</div>
    <div class="card rs-orari"><h2>Come si ordina</h2>
      <p>Puoi ordinare al massimo ${d.famiglia.max_ospiti} porzioni per categoria e pasto. Per cambiare il numero di ospiti contatta lo staff.</p></div>`;
}
function rsRidisegna(data) { const el = document.getElementById('rs-day-' + data); if (el) el.innerHTML = rsGiorno(data); }

function rsGiorno(data) {
  const f = RS.d.famiglia, tipi = rsTipi(data), rec = data === RS.d.oggi ? rsRecupero() : [];
  let html = `<h2 class="rs-day">${rec.length ? 'Recupero pasti · giorno di partenza' : esc(rsLabelData(data))}</h2>`;
  if (rec.length) html += '<p class="rs-note">In base al tuo piano puoi recuperare questi pasti. Ordina entro le 8:30.</p>';
  const disp = ['pranzo', 'cena'].filter(t => tipi[t] && (!rec.length || rec.includes(t)));
  if (!disp.length) return html + '<div class="card"><p class="hint">Nessun menu disponibile per questo giorno.</p></div>';
  let mostra = disp;
  if (!rec.length && disp.length > 1) {
    const esclusivo = f.trattamento === 'MP', ord = t => !!RS.d.ordini[`${data}_${t}`];
    if (!RS.mp[data]) RS.mp[data] = ord('pranzo') ? 'pranzo' : (ord('cena') ? 'cena' : (esclusivo ? null : disp.find(t => !ord(t)) || 'pranzo'));
    const sc = RS.mp[data];
    const btn = (t, ic, nome) => {
      const altroOrd = esclusivo && ord(t === 'pranzo' ? 'cena' : 'pranzo');
      const n = rsTotKey(`${data}_${t}`), st = ord(t) ? 'Ordinato' : (n ? `${n} ${n === 1 ? 'portata' : 'portate'}` : (t === 'pranzo' ? 'Mezzogiorno' : 'Sera'));
      return `<button type="button" class="rs-sel ${t}${sc === t ? ' on' : ''}" ${altroOrd ? 'disabled' : ''} onclick="rsScegli('${data}','${t}')"><span class="i">${ic}</span><b>${nome}</b><small>${st}</small></button>`;
    };
    html += `<div class="rs-selwrap"><p>${esclusivo ? 'Mezza pensione · scegli un pasto' : 'Pensione completa · ordina pranzo e cena'}</p>
      ${esclusivo && !sc ? '<small>Con la mezza pensione puoi ordinare <b>pranzo oppure cena</b>, non entrambi.</small>' : ''}
      <div class="rs-selbtns">${btn('pranzo', ICONS.SUN, 'Pranzo')}${btn('cena', ICONS.MOON, 'Cena')}</div></div>`;
    mostra = sc ? [sc] : [];
  }
  html += mostra.map(t => rsCard(data, t)).join('');
  const aperti = mostra.filter(t => !RS.d.ordini[`${data}_${t}`] && !rsScaduto(data));
  if (aperti.length) html += `<button type="button" class="rs-conferma" onclick="rsApriConferma('${data}')">Conferma ordine ${rsEtichettaOrdine(data)}</button>`;
  return html;
}
function rsScegli(data, tipo) {
  const prev = RS.mp[data];
  if (prev === tipo) return;
  if (prev && RS.d.famiglia.trattamento === 'MP') RS.sel[`${data}_${prev}`] = { piatti: {}, bambini: {}, note: '' };
  RS.mp[data] = tipo; rsRidisegna(data);
}

function rsCard(data, tipo) {
  const key = `${data}_${tipo}`, piatti = rsTipi(data)[tipo] || [], ord = RS.d.ordini[key], max = RS.d.famiglia.max_ospiti;
  const scaduto = !ord && rsScaduto(data), sel = rsSel(key);
  const ic = tipo === 'pranzo' ? ICONS.SUN : ICONS.MOON, nome = tipo === 'pranzo' ? 'Pranzo' : 'Cena';
  const head = `<div class="rs-head ${tipo}"><span class="i">${ic}</span><div><b>${nome}</b><small>${tipo === 'pranzo' ? 'Mezzogiorno' : 'Sera'} · ordina entro le 8:30</small></div>
    ${ord ? '<span class="rs-lock">Confermato</span>' : (scaduto ? '<span class="rs-lock off">Scaduto</span>' : '')}</div>`;
  let body = '';
  if (ord) {
    const per = {}; ord.piatti.forEach(p => { (per[p.categoria || 'Altro'] = per[p.categoria || 'Altro'] || []).push(p); });
    body = Object.entries(per).map(([c, l]) => `<div class="rs-cat"><div class="rs-cath"><span>${esc(c)}</span></div>${l.map(p => `<div class="rs-riga lock"><span>${esc(p.piatto)}</span><b>${p.quantita}</b></div>`).join('')}</div>`).join('')
      + (ord.note ? `<p class="rs-note">Note: ${esc(ord.note)}</p>` : '');
  } else if (scaduto) {
    body = '<p class="rs-note">Gli ordini per questo pasto sono chiusi.</p>';
  } else {
    const per = {}; piatti.forEach(p => { (per[p.categoria] = per[p.categoria] || []).push(p); });
    const cats = [...RS.d.categorie.filter(c => per[c]), ...Object.keys(per).filter(c => !RS.d.categorie.includes(c))];
    body = cats.map(c => {
      const tot = rsTotGruppo(key, c, piatti), g = RS_GRUPPI[c] ? c.split(' ')[0] + ' ' : '';
      return `<div class="rs-cat"><div class="rs-cath"><span>${esc(c)}</span><em>${g}${tot} / ${max}</em></div><div class="rs-bar"><i class="${tot >= max ? 'full' : ''}" style="width:${Math.min(100, Math.round(tot / max * 100))}%"></i></div>
        ${per[c].map(p => { const q = sel.piatti[p.id] || 0; return `<div class="rs-riga"><div><span class="${q ? '' : 'zero'}">${esc(p.piatto)}</span>${p.descrizione ? `<small>${esc(p.descrizione)}</small>` : ''}</div>
          <div class="rs-step"><button type="button" ${q ? '' : 'disabled'} onclick="rsStep('${key}','${p.id}',-1)" aria-label="Meno">−</button><b class="${q ? 'on' : ''}">${q}</b><button type="button" ${tot >= max ? 'disabled' : ''} onclick="rsStep('${key}','${p.id}',1)" aria-label="Più">+</button></div></div>`; }).join('')}</div>`;
    }).join('');
    const bambini = RS.d.menu_bambini || [], tb = rsTotBamb(key), aperto = RS.open && RS.open[key] !== undefined ? RS.open[key] : tb > 0;
    if (bambini.length) body += `<div class="rs-bamb"><button type="button" class="rs-bambh" onclick="rsToggleBamb('${key}')"><span>Menu bambini${tb ? ` · ${tb} portat${tb === 1 ? 'a' : 'e'}` : ''}</span><i>${aperto ? '▾' : '▸'}</i></button>
      ${aperto ? bambini.map((n, i) => { const q = sel.bambini[n] || 0; return `<div class="rs-riga"><div><span class="${q ? '' : 'zero'}">${esc(n)}</span></div><div class="rs-step"><button type="button" ${q ? '' : 'disabled'} onclick="rsStepB('${key}',${i},-1)" aria-label="Meno">−</button><b class="${q ? 'on' : ''}">${q}</b><button type="button" ${q >= 20 ? 'disabled' : ''} onclick="rsStepB('${key}',${i},1)" aria-label="Più">+</button></div></div>`; }).join('') : ''}</div>`;
    body += `<input class="rs-nota" type="text" maxlength="300" placeholder="Note (allergie, preferenze…)" value="${esc(sel.note)}" oninput="rsSel('${key}').note=this.value" autocomplete="off">`;
  }
  return `<div class="card rs-card${ord || scaduto ? ' locked' : ''}">${head}<div class="rs-body">${body}</div></div>`;
}
function rsToggleBamb(key) { RS.open = RS.open || {}; const cur = RS.open[key] !== undefined ? RS.open[key] : rsTotBamb(key) > 0; RS.open[key] = !cur; rsRidisegna(key.slice(0, 10)); }
function rsStep(key, id, delta) {
  const data = key.slice(0, 10), tipo = key.slice(11), piatti = rsTipi(data)[tipo] || [], m = piatti.find(p => p.id === id); if (!m) return;
  const sel = rsSel(key), cur = sel.piatti[id] || 0, max = RS.d.famiglia.max_ospiti;
  if (delta < 0 && cur <= 0) return;
  if (delta > 0 && rsTotGruppo(key, m.categoria, piatti) >= max) return;
  sel.piatti[id] = cur + delta; rsRidisegna(data);
}
function rsStepB(key, i, delta) {
  const n = RS.d.menu_bambini[i], sel = rsSel(key), cur = sel.bambini[n] || 0;
  if ((delta < 0 && cur <= 0) || (delta > 0 && cur >= 20)) return;
  sel.bambini[n] = cur + delta; if (RS.open === undefined) RS.open = {}; RS.open[key] = true; rsRidisegna(key.slice(0, 10));
}

// Pasti da inviare per un giorno: solo quelli non ancora confermati e con almeno una portata
function rsDaInviare(data) {
  const f = RS.d.famiglia, tipi = rsTipi(data), rec = data === RS.d.oggi ? rsRecupero() : [];
  let ts = ['pranzo', 'cena'].filter(t => tipi[t] && (!rec.length || rec.includes(t)));
  if (!rec.length && ts.length > 1 && f.trattamento === 'MP' && RS.mp[data]) ts = [RS.mp[data]];
  return ts.filter(t => !RS.d.ordini[`${data}_${t}`] && rsTotKey(`${data}_${t}`) > 0);
}
function rsEtichettaOrdine(data) { const pre = RS.d.famiglia.checkin && RS.d.famiglia.checkin > RS.d.oggi; return pre ? (data === RS.d.giorni[0] ? "dell'arrivo" : 'del giorno dopo') : (data === RS.d.oggi ? 'di oggi' : 'di domani'); }
function rsApriConferma(data) {
  const ts = rsDaInviare(data);
  if (!ts.length) { rsToast('Seleziona almeno un piatto prima di confermare'); return; }
  let tot = 0, righe = '';
  ts.forEach(t => {
    const key = `${data}_${t}`, sel = rsSel(key), piatti = rsTipi(data)[t];
    righe += `<h4>${t === 'pranzo' ? 'Pranzo' : 'Cena'}</h4>`;
    Object.entries(sel.piatti).filter(([, q]) => q > 0).forEach(([id, q]) => { const m = piatti.find(p => p.id === id); tot += q; righe += `<div class="r"><span>${esc(m ? m.piatto : '—')}</span><b>×${q}</b></div>`; });
    Object.entries(sel.bambini).filter(([, q]) => q > 0).forEach(([n, q]) => { tot += q; righe += `<div class="r"><span>${esc(n)} <em>BAMBINI</em></span><b>×${q}</b></div>`; });
    if (sel.note) righe += `<p class="n">Note: ${esc(sel.note)}</p>`;
  });
  rsChiudiConferma();
  const w = document.createElement('div'); w.id = 'rs-sheet';
  w.innerHTML = `<div class="bg" onclick="rsChiudiConferma()"></div><div class="pan"><i class="grip"></i>
    <h3>Ordine ${rsEtichettaOrdine(data)}</h3><p class="sub">${tot} portate selezionate · controlla prima di inviare</p>
    <div class="rie">${righe}</div><button type="button" id="rs-invia" class="rs-conferma" onclick="rsInvia('${data}')">Invia ordine</button>
    <button type="button" class="rs-annulla" onclick="rsChiudiConferma()">Torna indietro</button></div>`;
  document.body.appendChild(w);
}
function rsChiudiConferma() { const w = document.getElementById('rs-sheet'); if (w) w.remove(); }
async function rsInvia(data) {
  const ts = rsDaInviare(data), btn = document.getElementById('rs-invia');
  if (!ts.length) { rsChiudiConferma(); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Invio in corso…'; }
  const pasti = ts.map(t => { const s = rsSel(`${data}_${t}`); return { tipo: t, piatti: Object.entries(s.piatti).filter(([, q]) => q > 0).map(([id, q]) => ({ menu_id: id, quantita: q })), bambini: s.bambini, note: s.note || '' }; });
  const ERR = { ordini_chiusi: 'Gli ordini per questo pasto sono chiusi', quota_superata: 'Hai superato le porzioni disponibili', gia_ordinato: 'Questo pasto è già stato ordinato',
                mezza_pensione_un_pasto: 'Con la mezza pensione puoi ordinare un solo pasto al giorno', ordine_vuoto: 'Seleziona almeno un piatto' };
  try {
    const r = await chiama({ azione: 'ristorazione_ordina', data, pasti });
    if (!r.ok) {
      rsChiudiConferma(); rsToast(ERR[r.errore] || 'Non sono riuscito a inviare l\'ordine, riprova');
      if (r.errore === 'gia_ordinato' || r.errore === 'ordini_chiusi') renderRistorazione(true);
      return;
    }
    Object.assign(RS.d.ordini, r.ordini);
    ts.forEach(t => { delete RS.sel[`${data}_${t}`]; });
    rsChiudiConferma(); rsToast('Ordine inviato'); rsRidisegna(data);
  } catch (e) { rsChiudiConferma(); rsToast('Connessione assente, riprova'); }
}


// ── Prenota un tavolo ─────────────────────────────────────────────────────
// Stesso percorso guidato della navetta (card, passi numerati, pulsanti grandi, riepilogo).
// Azioni della Cloud Function: 'ristorazione_prenota_info', 'ristorazione_prenota',
// 'ristorazione_prenota_annulla'. Orari e turni li decide lo staff dalla Hub.
let PT = null, _ptAnnullaId = null, _ptInvio = false;
function ptCard() { return '<div id="pt-wrap"></div>'; }
async function ptInit(apri) {
  try {
    const d = await chiama({ azione: 'ristorazione_prenota_info' });
    if (d && d.ok) { PT = Object.assign({ sel: { data: '', pasto: '', turno: '', persone: null, note: '' }, aperto: false, tuttiGiorni: false }, PT || {}, d); }
  } catch (e) {}
  ptRender();

function gridSlotHtml(selezionato, onclickFn, escludiId, autista, persone, spiaggia) {
  const occupati = orariOccupati(escludiId);
  return slotsFasce().filter(({ slot }) => slot.some(slotLibero)).map(({ fascia, slot }) => `
    <div class="fascia-title">${esc(fascia.dal)} – ${esc(fascia.al)}</div>
    <div class="slot-grid">${slot.filter(slotLibero).map(ora =>
      `<button type="button" class="slot-btn${ora === selezionato ? ' selected' : ''}${!occupati.has(ora) && autistaPieno(ora, autista, persone, spiaggia) ? ' aut-occ' : ''}" data-ora="${ora}" ${slotLibero(ora) && !occupati.has(ora) ? '' : 'disabled'} onclick="${onclickFn}('${ora}')">${ora}</button>`).join('')}</div>`).join('');
}

// Punto di raccolta (impostato dalla struttura nelle impostazioni Navetta): uno
// per spiaggia oppure uno generico. Compare dopo la conferma, con la mappa.
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>';
function puntoRitiroPer(spiaggia) {
  const l = CFG.punti_ritiro || [], n = _nn(spiaggia);
  return (n && l.find(p => p.spiaggia && _nn(p.spiaggia) === n)) || l.find(p => !p.spiaggia) || null;
}
function puntoRitiroHtml(spiaggia) {
  const p = puntoRitiroPer(spiaggia);
  if (!p) return '';
  const haCoord = typeof p.lat === 'number' && typeof p.lng === 'number';
  const url = p.link || (haCoord ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking` : '');
  const d = 0.0025;   // ~280 m attorno al punto
  const mappa = haCoord
    ? `<iframe title="Mappa del punto di raccolta" src="https://www.openstreetmap.org/export/embed.html?bbox=${p.lng - d},${p.lat - d},${p.lng + d},${p.lat + d}&layer=mapnik&marker=${p.lat},${p.lng}"></iframe>` : '';
  return `<div class="punto-ritiro">
    <div class="pr-tit">${PIN}Dove farti trovare</div>
    ${p.nome ? `<div class="pr-nome">${esc(p.nome)}</div>` : ''}
    ${p.indicazioni ? `<div class="pr-ind">${esc(p.indicazioni)}</div>` : ''}
    ${mappa}
    ${url ? `<a class="pr-btn" href="${esc(url)}" target="_blank" rel="noopener">${PIN}Apri la mappa e raggiungi il punto</a>` : ''}
  </div>`;
}

// Richieste di oggi di questo ospite: card indipendente dal form, tenuta
// aggiornata da un polling leggero (l'ospite non ha un canale realtime).

  return `
    <div class="stato-card${chiusa ? ' chiusa' : ''}">
      <div class="riga">
        <div class="ora">${esc(c.orario || '—')}</div>
        <div class="meta">
          ${oggi ? '' : `<div class="quando">${esc(dataBreve(c.data))}</div>`}
          <span class="stato-badge ${s.cls}">${s.label}</span>
          ${c.autista_nome || c.persone ? `<div class="autista">${[c.autista_nome ? `Autista: ${esc(c.autista_nome)}` : '', c.persone ? _perPers(c.persone) : ''].filter(Boolean).join(' · ')}</div>` : ''}
          ${c.orario_precedente ? `<div class="modificata">Orario cambiato (era ${esc(c.orario_precedente)})</div>` : ''}

        <button type="button" class="btn-annulla" onclick="chiediAnnulla('${esc(c.id)}')">Annulla la corsa</button></div>` : ''}
      ${_annullaId === c.id ? `<div class="conferma-annulla"><p>Vuoi annullare la corsa delle <b>${esc(c.orario)}</b>?</p>
        <div class="err" id="annulla-err"></div>
        <div class="row-btns"><button type="button" class="ann" onclick="chiediAnnulla(null)">No, la tengo</button>
        <button type="button" class="conf rosso" id="annulla-conf" onclick="annullaCorsa('${esc(c.id)}')">Sì, annulla</button></div></div>` : ''}
      ${inModifica ? `<div class="edit-panel">
        <div class="lbl">Nuovo orario (almeno ${CFG.preavviso_minimo_minuti} minuti da adesso)</div>
        <div id="edit-slots">${gridSlotHtml(_editOrario, 'scegliOrarioNuovo', _editId, c.autista_nome, c.persone, c.spiaggia_nome)}</div>
        <div class="err" id="edit-err"></div>
        <div class="row-btns">
          <button type="button" class="ann" onclick="chiudiCambioOrario()">Annulla</button>
          <button type="button" class="conf" id="edit-conf" onclick="confermaCambioOrario()" ${_editOrario ? '' : 'disabled'}>Conferma</button>
